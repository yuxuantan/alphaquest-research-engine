studio:
  visible: true
  label: Yush Failed-Auction Reclaim
  description: Directional outside aggression must fail and reclaim a frozen value
    edge before entry.
  entry_criteria:
  - criterion: Developing value edge in a balanced auction
    reason: VAL or VAH defines the auction boundary being tested; the POC-in-middle-third
      check operationalizes the campaign's predeclared balanced-auction context.
    support: Core hypothesis
  - criterion: Prior-session or overnight reference within four ticks
    reason: The campaign claims absorption near already-known liquidity references.
      PDH, PDL, PDC, ONH, and ONL are causal before entry; opening-range levels are
      deliberately excluded because they are not part of the declared v02 input set.
    support: Research-supported concept; four-tick tolerance is a reviewed heuristic
  - criterion: At least the declared excursion beyond the frozen value edge
    reason: A touch is not a failed auction. Price must first demonstrate attempted
      continuation outside value before a reclaim can falsify that continuation.
    support: Mechanic definition; distance is predeclared for robustness testing
  - criterion: Outward one-sided aggressive flow during the excursion
    reason: This is the attempted continuation that the hypothesis says passive liquidity
      absorbs. It qualifies only when directional four-tick trade delta reaches the
      causal 90th percentile of completed earlier session observations or same-price,
      same-side 100 millisecond volume reaches its causal 99.5th percentile. The reference
      distribution excludes the active aggregation window and current event.
    support: Microstructure-supported concept with causal regime-normalized calibration
  - criterion: First trade at least one tick back inside within the reclaim window
    reason: One tick is the minimum unambiguous re-entry on ES, and using the first
      reclaim prevents post-hoc selection of a later favorable event.
    support: Causality and discrete-price definition
  - criterion: Frozen POC is favorable and covers declared risk and costs
    reason: The POC is the pre-entry fair-value objective. Rejecting targets that
      cannot cover risk and round-trip costs prevents mechanically uneconomic fills.
    support: Execution safeguard
  - criterion: Fill only on the next ordered trade event
    reason: The reclaim event creates the signal and cannot also be used as an assumed
      fill; the next event preserves causal entry timing.
    support: No-lookahead requirement
