methodology_policy:
  version: "2026-08-14.2"
  description: "Fail-closed staged policy separating scientific validity from generic investment objectives and destination suitability."

research_policy:
  data_scope: local_only
  primary_instrument: ES
  market_timezone: America/New_York
  no_paid_downloads: true
  final_decision_values:
    - PASS
    - FAIL
    - NEEDS MANUAL REVIEW
  candidate_language: candidate strategy

execution_defaults:
  tick_size: 0.25
  point_value: 50.0
  tick_value: 12.5
  commission_per_contract: 2.5
  slippage_ticks: 1
  position_sizing:
    mode: fixed_contracts
    contracts: 1

prop_flatten_rules:
  enabled: true
  latest_flat_time: "16:59:59"
  force_flatten_enabled: true
  force_flatten_time: "16:58:30"
  latest_entry_time: "16:45:00"
  no_overnight_positions: true

random_seeds:
  core_random_months: 31
  monkey: 7
  monte_carlo: 11
  due_diligence_sample: 7

methodology_caps:
  max_entry_tunables: 2
  max_stop_loss_tunables: 1
  max_take_profit_tunables: 1
  min_parameter_combinations: 8
  max_parameter_combinations: 120

stage_defaults:
  acceptance_stage: acceptance_oos_test
  pre_acceptance_stage_order:
    - limited_core_grid_test
    - limited_monkey_test
    - walk_forward_analysis
    - wfa_oos_monkey_test
    - wfa_oos_monte_carlo
    - simulated_incubation_core
    - simulated_incubation_monkey
  monkey_runs: 8000
  mechanics_validation:
    selection_mode: latest_eligible_sessions
    session_count: 10
    parameter_mode: declared_defaults
    manual_review_random_sample_size: 5
    manual_review_seed: 7
    minimum_trade_samples: 5
  research_objective_floors:
    minimum_evaluation_horizon_months: 12
    minimum_complete_wfa_windows: 3
    minimum_wfa_oos_trades: 50
    minimum_acceptance_oos_trades: 30
    minimum_mar: 0.40
    maximum_drawdown_fraction: 0.20
    minimum_monte_carlo_runs: 8000
    minimum_monte_carlo_horizon_months: 6
    minimum_net_profit_probability: 0.70
    maximum_account_breach_probability: 0.10
    minimum_forward_incubation_calendar_days: 90
    minimum_forward_incubation_trades: 30
    maximum_variants: 5
  shortlist_data_window:
    mode: random_fraction
    fraction: 0.10
    avoid_last_fraction: 0.10
    seed: 31
    avoid_ranges:
      - start_date: "2020-02-01"
        end_date: "2021-06-30"
  wfa_data_window:
    mode: before_sequential_holdouts
  core_grid:
    objective: MAR
    retain_iteration_reports: false
  monkey:
    seed: 7
    retain_iteration_reports: false
    constraints:
      trade_count_tolerance_pct: 0.05
      long_short_ratio_tolerance: 0.05
      average_bars_tolerance_pct: 0.10
      duration_shape: 0.70
      rth_only: true
      enforce_non_overlapping: true
  walk_forward_analysis:
    mode: unanchored
    train_months: 48
    test_months: 12
    step_months: 12
    objective: MAR
    selection_exclusive_min_trades_per_year: 50
    early_exit_min_train_profit_factor: 1.0
  wfa_oos_monte_carlo:
    runs: 8000
    seed: 11
    path_months: 6
    skip_trade_probability: 0.05
    cluster_losses: true
    retain_path_trades: false
    retain_path_events: false
  simulated_incubation:
    train_months: 48
    test_months: 12
  acceptance_oos:
    train_months: 24
    test_months: 6

stage_gates:
  limited_core_grid_test:
    criteria:
      - metric: summary.total_combinations_tested
        valid_parameter_combination_count: true
        decision_role: scientific_validity
      - metric: summary.percentage_profitable_iterations
        min: 0.70
        decision_role: scientific_validity
  limited_monkey_test:
    criteria:
      - metric: summary.core_beats_monkey_net_profit_rate
        min: 0.90
        decision_role: scientific_validity
      - metric: summary.core_beats_monkey_max_drawdown_rate
        min: 0.90
        decision_role: scientific_validity
  walk_forward_analysis:
    criteria:
      - metric: summary.early_exit
        equals: false
        decision_role: scientific_validity
      - metric: summary.realized_oos_windows
        min: 3
        decision_role: scientific_validity
      - metric: summary.realized_oos_trades
        min: 50
        decision_role: scientific_validity
      - metric: stitched_oos_metrics.annualization_available
        equals: true
        decision_role: scientific_validity
      - metric: stitched_oos_metrics.profit_factor
        min: 1.20
        decision_role: generic_objective
      - metric: stitched_oos_metrics.mar
        min: 0.40
        decision_role: generic_objective
      - metric: stitched_oos_metrics.trades_per_year
        min: 50
        decision_role: generic_objective
  wfa_oos_monkey_test:
    criteria:
      - metric: summary.core_beats_monkey_net_profit_rate
        min: 0.80
        decision_role: scientific_validity
      - metric: summary.core_beats_monkey_max_drawdown_rate
        min: 0.80
        decision_role: scientific_validity
  wfa_oos_monte_carlo:
    criteria:
      - metric: summary.number_of_runs
        min: 8000
        decision_role: scientific_validity
      - metric: summary.mean_net_pnl
        exclusive_min: 0.0
        decision_role: generic_objective
      - metric: summary.probability_net_profit_gt_0
        min: 0.70
        decision_role: generic_objective
  simulated_incubation_core:
    criteria:
      - metric: metrics.annualization_available
        equals: true
        decision_role: scientific_validity
      - metric: metrics.profit_factor
        min: 1.00
        decision_role: generic_objective
      - metric: metrics.mar
        min: 1.00
        decision_role: generic_objective
      - metric: metrics.trades_per_year
        min: 50
        decision_role: generic_objective
  simulated_incubation_monkey:
    criteria:
      - metric: summary.core_beats_monkey_net_profit_rate
        min: 0.80
        decision_role: scientific_validity
      - metric: summary.core_beats_monkey_max_drawdown_rate
        min: 0.80
        decision_role: scientific_validity
  acceptance_oos_test:
    criteria:
      - metric: metrics.annualization_available
        equals: true
        decision_role: scientific_validity
      - metric: metrics.profit_factor
        min: 1.00
        decision_role: generic_objective
      - metric: metrics.mar
        min: 1.00
        decision_role: generic_objective
      - metric: metrics.trades_per_year
        min: 50
        decision_role: generic_objective
