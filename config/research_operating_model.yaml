codex_policy:
  autonomous_permissions:
    - id: READ_AND_SEARCH_LITERATURE
      capability_type: ADVISORY
      grants_approval: false
      grants_override: false
      conditions: Bounded public-source task; output remains unverified or partial until captured and human-reviewed.
    - id: PROPOSE_HYPOTHESIS
      capability_type: PROPOSAL
      grants_approval: false
      grants_override: false
      conditions: Proposal only; no campaign creation, confirmation, parameter tuning, or holdout access.
    - id: CRITIQUE_HYPOTHESIS
      capability_type: ADVISORY
      grants_approval: false
      grants_override: false
      conditions: Advisory falsification and feasibility analysis; cannot admit or reject the hypothesis.
    - id: ESTIMATE_IMPLEMENTATION_FEASIBILITY
      capability_type: ADVISORY
      grants_approval: false
      grants_override: false
      conditions: Use certified catalog and declared data capabilities; unsupported mechanics require a handoff.
    - id: PREPARE_CAMPAIGN_DRAFT
      capability_type: PROPOSAL
      grants_approval: false
      grants_override: false
      conditions: Unconfirmed draft only, pre-PnL, within frozen objectives and parameter budgets.
    - id: IMPLEMENT_APPROVED_MECHANICS
      capability_type: AUTHORIZED_IMPLEMENTATION
      grants_approval: false
      grants_override: false
      conditions: Human has approved the bounded implementation scope; Codex may edit code and tests but cannot certify or approve fidelity.
    - id: RUN_AUTHORED_HISTORICAL_ATTEMPT
      capability_type: AUTHORIZED_EXECUTION_REQUEST
      grants_approval: false
      grants_override: false
      conditions: Only an existing unused attempt with current approval and deterministic preflight; AlphaQuest owns the verdict.
    - id: RUN_PREDECLARED_ROBUSTNESS
      capability_type: AUTHORIZED_EXECUTION_REQUEST
      grants_approval: false
      grants_override: false
      conditions: No gate, window, parameter-space, or methodology changes.
    - id: SUMMARIZE_EVIDENCE
      capability_type: ADVISORY
      grants_approval: false
      grants_override: false
      conditions: Preserve failures, uncertainty, axes, and exact identities; no reclassification.
    - id: IDENTIFY_AND_DIAGNOSE_BUGS
      capability_type: ADVISORY
      grants_approval: false
      grants_override: false
      conditions: Diagnosis is separate from authorization to change mechanics or evidence.
    - id: RED_TEAM_CANDIDATE
      capability_type: ADVISORY
      grants_approval: false
      grants_override: false
      conditions: Separate task and ownership record from implementation; findings require human disposition.
    - id: PREPARE_FORWARD_OR_DEPLOYMENT_REVIEW_PACKAGE
      capability_type: PROPOSAL
      grants_approval: false
      grants_override: false
      conditions: Assemble and explain current evidence only; cannot start incubation or authorize deployment.
    - id: ANALYZE_LIVE_DIAGNOSTICS
      capability_type: ADVISORY
      grants_approval: false
      grants_override: false
      conditions: Advisory only; cannot change risk, pause rules, sizing, authorization, or research history.
  machine_prohibitions:
    - id: NO_SELF_APPROVAL
      actor: CODEX
      capability: APPROVAL
      actions: [APPROVE_MECHANICAL_INTERPRETATION, APPROVE_HISTORICAL_CANDIDATE, ACCEPT_FORWARD_REVIEW, RECORD_PORTFOLIO_DISPOSITION]
      effect: PROHIBITED
    - id: NO_LOCKED_OOS_OPEN
      actor: CODEX
      capability: TRANSITION_INITIATION
      actions: [OPEN_LOCKED_ACCEPTANCE_OOS]
      effect: PROHIBITED
    - id: NO_RESEARCH_VERDICT
      actor: CODEX
      capability: DECISION
      actions: [RECORD_HISTORICAL_SCREENING_FAILURE, RECORD_HISTORICAL_VERDICT]
      effect: PROHIBITED
    - id: NO_DEPLOYMENT_AUTHORITY
      actor: CODEX
      capability: APPROVAL
      actions: [AUTHORIZE_DEPLOYMENT, PROMOTE_SHADOW_TO_SMALL_LIVE, PROMOTE_SMALL_LIVE_TO_LIVE]
      effect: PROHIBITED
    - id: NO_GATE_OVERRIDE
      actor: CODEX
      capability: OVERRIDE
      actions: [DETERMINISTIC_GATES, CAMPAIGN_STOP]
      effect: PROHIBITED
    - id: NO_EVIDENCE_REWRITE
      actor: CODEX
      capability: MUTATION
      actions: [IMMUTABLE_RESEARCH_EVIDENCE]
      effect: PROHIBITED
    - id: NO_OOS_REDEFINITION
      actor: CODEX
      capability: MUTATION
      actions: [CONSUMED_OOS_OR_HOLDOUT]
      effect: PROHIBITED
    - id: NO_RETRY_UNTIL_PASS
      actor: CODEX
      capability: EXECUTION
      actions: [UNBUDGETED_RESCUE, ATTEMPT_ID_REUSE]
      effect: PROHIBITED
    - id: NO_UNGOVERNED_RECERTIFICATION
      actor: CODEX
      capability: CERTIFICATION
      actions: [RECERTIFY_WITHOUT_GOVERNED_PROCESS]
      effect: PROHIBITED
  human_gated_actions:
    - ADMIT_HYPOTHESIS_FOR_IMPLEMENTATION
    - APPROVE_MECHANICAL_INTERPRETATION
    - OPEN_LOCKED_ACCEPTANCE_OOS
    - APPROVE_HISTORICAL_CANDIDATE
    - START_FORWARD_INCUBATION
    - ACCEPT_FORWARD_REVIEW
    - RECORD_PORTFOLIO_DISPOSITION
    - AUTHORIZE_DEPLOYMENT
    - PROMOTE_SHADOW_TO_SMALL_LIVE
    - PROMOTE_SMALL_LIVE_TO_LIVE
    - CHANGE_LIVE_SIZING_OR_RISK
    - RETIRE_OR_REENABLE_LIVE_INSTANCE
    - APPROVE_SEMANTIC_METHODOLOGY_CHANGE
    - APPROVE_SEMANTIC_DATA_CHANGE
    - APPROVE_SEMANTIC_IMPLEMENTATION_CHANGE
    - DISCRETIONARILY_ABANDON_CAMPAIGN
    - ABANDON_EDGE_FAMILY
    - REVISIT_FAILED_EDGE
  prohibitions:
    - id: WEAKEN_GATE_AFTER_RESULTS
      enforceable_rule: Codex cannot modify gate thresholds, roles, or objectives after any bound result is visible.
    - id: MODIFY_OOS_AFTER_ACCESS
      enforceable_rule: Codex cannot move, reopen, replace, or redefine a consumed OOS or holdout window.
    - id: DELETE_FAILED_RESEARCH
      enforceable_rule: Failed attempts, runs, searches, and lineage are durable and cannot be deleted or hidden.
    - id: HIDE_PARAMETER_SEARCH
      enforceable_rule: Every tried parameter space and outcome remains in the immutable attempt lineage.
    - id: REWRITE_HISTORICAL_EVIDENCE
      enforceable_rule: Codex cannot edit ResultBundles, verdicts, trade logs, approvals, or immutable run artifacts.
    - id: RETROACTIVELY_CHANGE_METHODOLOGY_IDENTITY
      enforceable_rule: Old evidence retains its original methodology version and hash.
    - id: SELF_APPROVE_MECHANICS
      enforceable_rule: Codex cannot create or sign mechanics approval for implementation it proposed or changed.
    - id: SELF_APPROVE_RED_TEAM
      enforceable_rule: Codex red-team output is advisory and requires human disposition; it is not approval.
    - id: RECERTIFY_WITHOUT_PROCESS
      enforceable_rule: Changed execution code requires classification, required tests, version review, and governed recertification.
    - id: AUTHORIZE_OR_PROMOTE_LIVE
      enforceable_rule: Codex cannot authorize deployment, shadow, small-live, live, re-enablement, or sizing.
    - id: CHANGE_RISK_TO_RESCUE_STRATEGY
      enforceable_rule: Codex cannot loosen live risk or allocation limits to accommodate a strategy.
    - id: CHANGE_ACCOUNT_RULES_TO_CREATE_SUITABILITY
      enforceable_rule: Exact account profiles remain external/versioned facts; a new profile cannot relabel the old assessment.
    - id: CONVERT_MISSING_EVIDENCE_TO_PASS
      enforceable_rule: Missing, stale, ambiguous, or unsupported evidence is NEEDS_MANUAL_REVIEW or blocked, never PASS.
    - id: SILENTLY_APPROXIMATE_UNSUPPORTED_MECHANICS_OR_DATA
      enforceable_rule: Unsupported fidelity requires an engineering handoff or explicit unavailable state.
    - id: RETRY_UNTIL_PASS
      enforceable_rule: Every execution requires a new governed attempt and budget; identity renaming cannot reset search history.
    - id: USE_LIVE_RESULTS_TO_REWRITE_RESEARCH
      enforceable_rule: Live observations may seed a new observation or hypothesis only; they never mutate old research.

deterministic_authority:
  decisions:
    - HASH_EQUALITY_AND_CONTENT_IDENTITY
    - CERTIFICATION_CURRENTNESS
    - DATA_AND_ROLL_BINDING
    - METHODOLOGY_VERSION_AND_HASH_BINDING
    - PREDECLARED_NUMERICAL_STAGE_GATES
    - IMMUTABLE_SCIENTIFIC_VERDICT_RECORDING
    - HISTORICAL_CANDIDATE_ELIGIBILITY
    - WFA_SELECTION_AND_STITCHED_OOS_CALCULATION
    - MONTE_CARLO_AND_ACCOUNT_RULE_CALCULATION
    - SAMPLE_SIZE_AND_CALENDAR_GATES
    - ONE_RUN_PER_ATTEMPT
    - LEGAL_TRANSITION_PREREQUISITES
    - IMMUTABLE_ARTIFACT_CREATION_AND_HASH_CHAIN_VALIDATION
    - CANONICAL_FORWARD_EVENT_CAPTURE_AFTER_SOURCE_VALIDATION
    - PREDECLARED_CAMPAIGN_STOP_AND_ATTEMPT_BLOCKING
    - SAME_CONTRACT_DATA_APPEND_IDENTITY_AND_VALIDATION
    - STALE_APPROVAL_INVALIDATION
    - CANDIDATE_AND_FORWARD_CURRENTNESS
    - FORWARD_CHRONOLOGY_AND_THRESHOLD_ELIGIBILITY
    - PORTFOLIO_STATISTICS
    - ALLOCATION_AND_ACCOUNT_LIMIT_CHECKS
    - MONITORING_ALERT_AND_SAFETY_RULES
  override_policy:
    codex_may_override: false
    human_may_override_missing_or_failed_objective_evidence: false
    human_may_make_named_judgment_after_objective_prerequisites_pass: true

separation_of_duties:
  - id: HYPOTHESIS_GENERATION_VS_IMPLEMENTATION
    producer_role: hypothesis_proposer
    reviewer_or_consumer_role: implementation_owner
    rule: Mechanics and parameters must derive from the accepted causal specification, not observed PnL.
    required_separate_task: true
  - id: IMPLEMENTATION_VS_EVALUATION
    producer_role: implementation_owner
    reviewer_or_consumer_role: deterministic_evaluator
    rule: The implementation task cannot change gates, data windows, or objectives; AlphaQuest computes outcomes.
    required_separate_task: true
  - id: EVALUATION_VS_RED_TEAM
    producer_role: deterministic_evaluator
    reviewer_or_consumer_role: separate_red_team_task_owner
    rule: Promising results require a fresh separately recorded adversarial task before the human owner records candidate disposition.
    required_separate_task: true
  - id: IMPLEMENTATION_VS_RED_TEAM
    producer_role: implementation_task_owner
    reviewer_or_consumer_role: separate_red_team_task_owner
    rule: The red-team task uses fresh context and distinct provenance from implementation; it need not require a second human identity.
    required_separate_task: true
  - id: HISTORICAL_VS_FORWARD
    producer_role: historical_evaluator
    reviewer_or_consumer_role: alphaquest_forward_evidence_custodian
    rule: Forward evidence must occur after the frozen start and cannot be backfilled from historical periods.
    required_separate_task: true
  - id: SCIENTIFIC_VALIDITY_VS_ACCOUNT_SUITABILITY
    producer_role: scientific_evaluator
    reviewer_or_consumer_role: account_assessor
    rule: Account assessment requires scientific PASS and cannot modify SCIENTIFIC_STATE.
    required_separate_task: true
  - id: CANDIDATE_VS_DEPLOYMENT
    producer_role: candidate_disposition_task
    reviewer_or_consumer_role: deployment_authorization_task
    rule: Candidate status supplies evidence only; deployment requires a separate human decision and current forward evidence.
    required_separate_task: true
  - id: LIVE_OBSERVATION_VS_RETROACTIVE_RESEARCH
    producer_role: live_monitor
    reviewer_or_consumer_role: new_hypothesis_owner
    rule: Live evidence may create new lineage but cannot change old hypotheses, attempts, results, or verdicts.
    required_separate_task: true

attempt_and_search_governance:
  hierarchy: [EDGE_FAMILY, HYPOTHESIS, CAMPAIGN, STRATEGY_VARIANT, ATTEMPT, RUN]
  variant_budget:
    source: GOVERNED_METHODOLOGY_OR_FROZEN_CAMPAIGN_PROTOCOL
    explicit_identity_required: true
    bounded: true
    p1_numeric_limit: null
    renaming_resets_budget: false
  rescue_budget:
    source: GOVERNED_METHODOLOGY_OR_FROZEN_CAMPAIGN_PROTOCOL
    explicit_and_predeclared: true
    frozen_before_relevant_results: true
    missing_budget_effect: RESCUE_PROHIBITED
    budget_exhaustion_effect: RESCUE_PROHIBITED
    each_rescue_new_attempt_identity: true
    history_immutable: true
    renaming_resets_budget: false
    post_oos_reopen_or_redefinition: PROHIBITED
    hypothesis_change_same_lineage: PROHIBITED
  post_oos_tuning_same_lineage: PROHIBITED
  consumed_holdout_reopen: PROHIBITED
  every_execution_new_attempt_identity: true
  retry_until_pass: STRUCTURALLY_PROHIBITED
  new_variant_when:
    - Same accepted economic hypothesis, materially distinct value-independent mechanics.
    - Immediately prior variant has current manual mechanics approval and terminal scientific FAIL.
    - Campaign is not EXHAUSTED or ABANDONED and the identified governed external variant budget remains.
    - No post-OOS tuning is permitted inside the same research generation.
  new_attempt_when:
    - Any original execution, exact replication, data refresh, methodology rerun, pre-PnL protocol declaration, pre-PnL mechanics correction, pre-PnL parameter declaration, or authorized rescue.
  rerun_definition: A new attempt using the same frozen protocol; never a second run on the prior attempt.
  methodology_rerun_definition: A new attempt adopting a distinguishable methodology version/hash or explicitly changed governed validation window.
  implementation_correction_definition: A same-variant, new-attempt correction only before PnL; after PnL, semantic mechanics change requires new governed variant or research generation.
  new_hypothesis_when: The causal mechanism, counterparty, information timing, or transfer rationale is materially different; renaming is insufficient.
  immutable_evidence:
    - accepted_hypotheses
    - published_variant_configs
    - attempt_manifests
    - run_artifacts
    - parameter_spaces_and_search_history
    - mechanics_approvals
    - terminal_verdicts
    - candidate_and_forward_reviews
    - abandonment_and_revisit_decisions
  anti_reset_rule: Campaign, variant, or edge-family renaming cannot reset lineage, budgets, failures, or consumed holdouts.

historical_verdict_policy:
  terminal_scientific_outcomes: [PASS, FAIL, NEEDS_MANUAL_REVIEW]
  recording_advances_lifecycle: false
  recording_creates_candidate_status: false
  candidate_review_required_scientific_state: PASS
  candidate_review_prohibited_scientific_states: [FAIL, NEEDS_MANUAL_REVIEW]
  needs_manual_review_resolution: governed_new_or_completed_evidence_with_distinct_identity_and_scientific_pass
  original_verdict_is_immutable: true
  fail_disposition_options:
    - successor_variant_when_governed_and_budget_remains
    - campaign_exhaustion_when_campaign_level_rule_is_satisfied
    - discretionary_campaign_abandonment
    - governed_revisit_in_new_lineage

campaign_termination_policy:
  shared_effects:
    - no_more_attempts_without_revisit_decision
    - preserve_ledger_configs_attempts_runs_and_verdicts
    - remove_from_active_execution_surfaces_without_deleting_history
    - record_reason_actor_timestamp_and_bound_evidence_hashes
  deterministic_stop:
    outcome: EXHAUSTED
    authority: ALPHAQUEST_DETERMINISTIC_ENGINE
    requires_human_approval: false
    rule_must_be_predeclared: true
    scope: campaign_level_only
    criteria:
      - governed_variant_budget_exhausted
      - campaign_research_or_search_budget_exhausted
      - campaign_fresh_holdout_budget_exhausted
      - campaign_opportunity_frequency_structurally_infeasible_under_predeclared_requirement
      - required_data_or_fidelity_structurally_unavailable_for_campaign
      - execution_infeasibility_applies_to_campaign_hypothesis_or_mechanical_family
      - explicit_predeclared_campaign_level_termination_contract_satisfied
  variant_failure:
    outcome: terminal_scientific_FAIL_for_bound_attempt_or_variant_path
    automatically_exhausts_campaign: false
    limited_stage_failures:
      - core_grid
      - monkey
      - walk_forward_analysis
      - monte_carlo
      - acceptance
    successor_may_remain_when:
      - terminal_predecessor_FAIL_is_current
      - authorized_variant_budget_remains
      - no_campaign_level_stop_rule_is_satisfied
      - successor_mechanics_are_materially_distinct_and_same_hypothesis
    effects:
      - preserve_terminal_failure_and_search_history
      - stop_the_bound_attempt_or_variant_path
      - do_not_create_candidate_status
  discretionary_abandonment:
    outcome: ABANDONED
    authority: HUMAN_OWNER_RESEARCHER
    requires_human_approval: true
    criteria:
      - unstable_parameter_neighborhood_requires_scientific_judgment
      - failure_across_materially_distinct_valid_expressions
      - evidence_contradicts_the_economic_hypothesis
      - repeated_robustness_or_unseen_evidence_failure_requires_interpretation
      - discretionary_research_budget_priority_decision

edge_family_abandonment:
  requires_human_approval: true
  outcomes: [CONTINUE, LOWER_PRIORITY, SUSPEND, ABANDON, REVISITABLE]
  decision_factors:
    - independence_of_mechanical_expressions
    - whether_expressions_tested_the_same_causal_mechanism
    - sample_adequacy
    - data_fidelity
    - execution_fidelity
    - consistency_or_contradiction_of_empirical_results
    - strength_and_independence_of_external_evidence
    - consumed_research_budget_and_holdouts
  rules:
    - One campaign FAIL never automatically proves edge-family failure.
    - Many cosmetic or parameter-neighbor failures count as one expression, not independent evidence.
    - Data or execution defects support SUSPEND or REVISITABLE, not a false scientific conclusion.
    - Repeated adequate independent failures of the same causal mechanism support ABANDON.
    - Contradictory credible evidence must remain visible in the disposition.

revisit_policy:
  prior_failure_must_remain: true
  requires_human_approval: true
  requires_new_lineage_identity: true
  valid_triggers:
    - materially_new_dataset
    - substantially_longer_sample
    - different_instrument_with_justified_transfer_mechanism
    - documented_market_structure_or_regime_change
    - newly_available_execution_data
    - corrected_engine_bug
    - new_independent_academic_or_exchange_evidence
    - materially_different_causal_mechanism
  invalid_triggers:
    - backtest_was_close
    - minor_threshold_tweak
    - campaign_or_edge_relabel
    - try_more_parameters
    - reopen_failed_oos
    - rerun_until_pass
  required_evidence:
    - prior_edge_family_and_campaign_lineage
    - exact_trigger_and_supporting_evidence
    - why_new_information_is_material
    - new_hypothesis_or_research_generation_identity
    - fresh_budget_and_holdout_plan

change_governance:
  methodology:
    semantic_change_examples:
      - stage_order_or_gate_role
      - numerical_threshold_or_objective_floor
      - sample_selection_or_holdout_policy
      - fill_causality_or_promotion_rule
      - verdict_semantics_or_artifact_lineage
    non_semantic_examples:
      - spelling_or_formatting_with_no_interpretation_change
      - explanatory_link_update
    proposer: [CODEX, HUMAN_OWNER_RESEARCHER]
    approver: HUMAN_OWNER_RESEARCHER
    required_regression: [methodology_regression, causal_execution_regression, full_validate]
    version_rule: Every semantic change increments methodology version and changes policy hash.
    formatting_rule: Even non-semantic byte changes create a new hash and require deliberate review; version increment depends on declared semantic classification.
    old_campaign_effect: Old evidence stays valid only as evidence under its original methodology identity.
    rerun_rule: New research uses the new identity; selected old research needs an explicit methodology_rerun attempt only when a current decision under the new policy is required.
    retroactive_rewrite: prohibited
  data:
    categories:
      - id: ADD_ROWS_SAME_CERTIFIED_DATASET
        materiality: non_semantic_when_certified_contract_is_unchanged
        preserves_dataset_identity: false
        new_version_or_hash: true
        invalidates_old_results: false
        ingestion: automatic_after_unchanged_contract_validation
        rerun: not_automatic_explicit_data_refresh_attempt_required_to_claim_new_research_evidence
        human_review: not_required_for_ingestion_or_content_versioning
        campaign_rebind: human_or_governed_research_decision
        locked_window_effect: cannot_change_or_leak_into_frozen_OOS_or_holdout_boundaries
        recertification: no_unless_feature_or_execution_semantics_change
      - id: ADD_NEW_INSTRUMENT
        materiality: material
        preserves_dataset_identity: false
        new_version_or_hash: true
        invalidates_old_results: false
        rerun: new_campaign_or_justified_transfer_generation
        human_review: required
        recertification: required_if_strategy_support_or_execution_contract_changes
      - id: CHANGE_VENDOR_OR_SOURCE
        materiality: material
        preserves_dataset_identity: false
        new_version_or_hash: true
        invalidates_old_results: false
        rerun: explicit_data_refresh_attempt
        human_review: required
        recertification: required_if_source_semantics_affect_strategy_or_execution
      - id: CHANGE_ROLL_METHODOLOGY
        materiality: material
        preserves_dataset_identity: false
        new_version_or_hash: true
        invalidates_old_results: false
        rerun: explicit_data_refresh_or_methodology_rerun_as_classified
        human_review: required
        recertification: no_unless_implementation_assumptions_change
      - id: FIX_TIMESTAMPS
        materiality: material
        preserves_dataset_identity: false
        new_version_or_hash: true
        invalidates_old_results: false
        rerun: required_for_current_claims
        human_review: required
        recertification: required_if_signal_availability_or_entry_timing_changes
      - id: CHANGE_AGGRESSOR_CLASSIFICATION
        materiality: material
        preserves_dataset_identity: false
        new_version_or_hash: true
        invalidates_old_results: false
        rerun: required_for_dependent_results
        human_review: required
        recertification: required_for_dependent_event_strategies
      - id: CHANGE_NORMALIZATION
        materiality: material
        preserves_dataset_identity: false
        new_version_or_hash: true
        invalidates_old_results: false
        rerun: required_for_dependent_results
        human_review: required
        recertification: required_if_strategy_or_execution_semantics_change
      - id: ADD_NEW_FIELDS
        materiality: potentially_material
        preserves_dataset_identity: false
        new_version_or_hash: true
        invalidates_old_results: false
        rerun: only_for_research_that_uses_new_or_recomputed_fields
        human_review: required_for_semantics_and_availability
        recertification: required_for_new_dependent_strategy_logic
      - id: REPAIR_CORRUPT_DATA
        materiality: material
        preserves_dataset_identity: false
        new_version_or_hash: true
        invalidates_old_results: false
        rerun: required_for_current_claims
        human_review: required
        recertification: no_unless_semantics_change
      - id: CHANGE_SESSION_DEFINITIONS
        materiality: material
        preserves_dataset_identity: false
        new_version_or_hash: true
        invalidates_old_results: false
        rerun: required_for_dependent_results
        human_review: required
        recertification: required_for_session_dependent_logic
    same_contract_append_policy:
      unchanged_contract_dimensions:
        - vendor_and_source
        - schema
        - normalization
        - session_semantics
        - timestamp_semantics
        - roll_methodology
        - field_semantics
      automatic_actions:
        - capture_rows
        - create_new_content_and_data_identity
        - validate_unchanged_contract
        - preserve_prior_dataset_and_evidence_identity
      governed_research_decisions:
        - rebind_frozen_campaign_to_expanded_dataset
        - change_locked_historical_or_holdout_boundary
        - create_data_refresh_attempt
        - claim_new_research_evidence_from_expanded_sample
      frozen_boundary_rule: Appended rows cannot silently enter a frozen OOS, holdout, attempt, run, or evidence binding.
    default: Uncertain semantic equivalence is material and fail-closed.
  implementation:
    equivalence_policy:
      approved_deterministic_standard_required: true
      current_capability: not_claimed_by_P1
      default_when_missing_failed_or_uncertain: semantic_or_uncertain_path
      required_evidence:
        - old_and_new_implementation_identities
        - approved_equivalence_standard_identity
        - deterministic_equivalence_results
        - fresh_implementation_certification
      proven_non_semantic_allowances:
        - historical_evidence_may_remain_admissible_through_explicit_equivalence_lineage
        - mechanics_approval_may_remain_current_or_be_mechanically_rebound_under_approved_policy
        - forward_incubation_may_continue_without_automatic_restart
      deployment_rule: Deployment remains blocked until the new implementation certification and all required bindings are current.
    categories:
      - id: COMMENT_OR_DOCS_ONLY
        equivalence_class: no_execution_byte_change
        new_implementation_hash: only_if_certification_manifest_declares_file_execution_affecting
        certification: unchanged_if_execution_bytes_unchanged
        mechanics_approval: unchanged_if_bound_execution_identity_unchanged
        historical_results: remain_under_original_identity
        rerun: no
        forward_incubation: unchanged_if_all_bound_hashes_current
        deployment: unchanged_if_all_bound_execution_identities_are_current
        requires_approved_equivalence_standard: false
        full_scientific_rerun_unconditionally_required: false
      - id: REFACTOR_PROVEN_BEHAVIOR_IDENTICAL
        equivalence_class: proven_non_semantic
        new_implementation_hash: true
        certification: stale_until_fresh_certification_records_approved_equivalence_evidence
        mechanics_approval: may_remain_current_or_be_rebound_only_as_approved_equivalence_policy_allows
        historical_results: may_remain_admissible_via_explicit_old_to_new_equivalence_lineage
        rerun: not_intrinsically_required_after_approved_equivalence_certification
        forward_incubation: may_continue_without_restart_after_approved_equivalence_certification
        deployment: blocked_until_new_implementation_certification_and_bindings_are_current
        requires_approved_equivalence_standard: true
        full_scientific_rerun_unconditionally_required: false
      - id: BUG_FIX_BEHAVIOR_UNCHANGED
        equivalence_class: proven_non_semantic
        new_implementation_hash: true
        certification: stale_until_fresh_certification_records_approved_equivalence_evidence
        mechanics_approval: may_remain_current_or_be_rebound_only_as_approved_equivalence_policy_allows
        historical_results: may_remain_admissible_via_explicit_old_to_new_equivalence_lineage
        rerun: not_intrinsically_required_after_approved_equivalence_certification
        forward_incubation: may_continue_without_restart_after_approved_equivalence_certification
        deployment: blocked_until_new_implementation_certification_and_bindings_are_current
        requires_approved_equivalence_standard: true
        full_scientific_rerun_unconditionally_required: false
      - id: BUG_FIX_BEHAVIOR_CHANGED
        equivalence_class: semantic
        new_implementation_hash: true
        certification: stale_new_version_review_and_recertification
        mechanics_approval: stale_new_review_required
        historical_results: remain_historical_not_current_for_changed_code
        rerun: required_new_attempt_or_variant_as_causal_scope_dictates
        forward_incubation: stop_and_restart_from_new_candidate
        deployment: blocked_until_new_evidence_certification_and_approval_are_current
        requires_approved_equivalence_standard: false
        full_scientific_rerun_unconditionally_required: true
      - id: PERFORMANCE_ONLY_OPTIMIZATION
        equivalence_class: proven_non_semantic
        new_implementation_hash: true
        certification: stale_until_fresh_certification_records_approved_equivalence_evidence
        mechanics_approval: may_remain_current_or_be_rebound_only_as_approved_equivalence_policy_allows
        historical_results: may_remain_admissible_via_explicit_old_to_new_equivalence_lineage
        rerun: not_intrinsically_required_after_approved_equivalence_certification
        forward_incubation: may_continue_without_restart_after_approved_equivalence_certification
        deployment: blocked_until_new_implementation_certification_and_bindings_are_current
        requires_approved_equivalence_standard: true
        full_scientific_rerun_unconditionally_required: false
      - id: MECHANICS_CHANGE
        equivalence_class: semantic
        new_implementation_hash: true
        certification: old_certification_stale_then_new_version_review_and_recertification
        mechanics_approval: new_approval_required
        historical_results: cannot_support_changed_mechanics
        rerun: new_variant_or_new_generation_and_new_attempt_required
        forward_incubation: terminate_old_path_and_restart_only_after_new_candidate
        deployment: blocked_until_new_evidence_certification_and_approval_are_current
        requires_approved_equivalence_standard: false
        full_scientific_rerun_unconditionally_required: true
      - id: DEPENDENCY_SEMANTIC_CHANGE
        equivalence_class: semantic
        new_implementation_hash: true
        certification: stale_new_version_review_and_recertification
        mechanics_approval: stale
        historical_results: remain_under_original_environment_identity
        rerun: required_for_current_evidence
        forward_incubation: existing_plan_stale_for_current_promotion
        deployment: blocked_until_new_evidence_certification_and_approval_are_current
        requires_approved_equivalence_standard: false
        full_scientific_rerun_unconditionally_required: true
    default: Uncertain behavior equivalence is semantic, invalidates certification and approval, and requires new evidence.

invalidation_cascades:
  - id: STRATEGY_SOURCE_CHANGE
    trigger: execution_affecting_strategy_source_hash_changes
    cascade:
      - implementation_identity_changes
      - certification_becomes_stale
      - classify_change_with_approved_equivalence_standard
      - semantic_uncertain_or_failed_equivalence_stales_mechanics_approval_candidate_and_forward_currentness
      - dependent_execution_and_promotion_block_until_classification_and_certification_are_current
    historical_treatment: Old evidence remains immutable under the old implementation identity.
  - id: PROVEN_NON_SEMANTIC_IMPLEMENTATION_CHANGE
    trigger: approved_deterministic_equivalence_standard_proves_relevant_behavior_unchanged
    cascade:
      - new_implementation_identity_and_fresh_certification
      - explicit_old_to_new_equivalence_lineage
      - mechanics_approval_remains_current_or_is_mechanically_rebound_only_under_approved_policy
      - historical_evidence_may_remain_admissible
      - forward_incubation_may_continue_without_automatic_restart
      - deployment_blocked_until_certification_and_bindings_current
    historical_treatment: Old evidence is never rewritten and equivalence is an additional immutable lineage claim.
  - id: METHODOLOGY_CHANGE
    trigger: semantic_methodology_version_or_hash_changes
    cascade:
      - old_evidence_remains_valid_only_under_old_methodology
      - new_research_binds_new_identity
      - current_decision_under_new_policy_requires_explicit_methodology_rerun
    historical_treatment: Never rewrite old config, evidence, hash, or verdict.
  - id: MATERIAL_DATA_CHANGE
    trigger: source_bytes_or_any_data_semantics_change_materially
    cascade:
      - new_dataset_identity_and_hash
      - old_evidence_remains_bound_to_old_dataset
      - new_claim_requires_explicit_data_refresh_or_new_campaign
      - dependent_approval_and_candidate_do_not_carry_forward
    historical_treatment: Preserve the old dataset/result lineage and disclose supersession.
  - id: CONFIG_OR_PARAMETER_CHANGE
    trigger: executable_config_or_predeclared_parameter_space_changes
    cascade:
      - new_config_hash
      - mechanics_approval_stale
      - unused_new_attempt_required
      - candidate_forward_and_deployment_bindings_stale
    historical_treatment: Preserve prior config and results; never edit in place.
  - id: ACCOUNT_PROFILE_CHANGE
    trigger: profile_version_hash_cost_or_rule_snapshot_changes
    cascade:
      - prior_suitability_remains_exact_profile_history
      - new_assessment_required
      - deployment_package_stale_if_it_depends_on_changed_profile
    historical_treatment: Scientific state is unchanged.
  - id: LIVE_RISK_OR_ALLOCATION_CHANGE
    trigger: sizing_limits_kill_rules_or_allocation_change
    cascade:
      - new_deployment_package_and_human_authorization_required
      - old_live_instance_paused_or_retired
    historical_treatment: Research results and scientific state are unchanged.

forward_evidence_policy:
  event_source_actor: EXTERNAL_SYSTEM
  canonical_evidence_owner: ALPHAQUEST_DETERMINISTIC_ENGINE
  automatic_append_after_validation: true
  required_capture_validation:
    - source_identity
    - strict_post_start_chronology
    - event_hash
    - previous_event_hash
    - attachment_hashes
    - reconciliation_fields
  invalid_missing_or_ambiguous_evidence: fail_closed_without_append
  allowed_sources:
    - paper_execution_after_plan_start
    - shadow_execution_after_plan_start
    - live_market_observation_after_plan_start
  prohibited_sources:
    - historical_backfill
    - reconstructed_pre_start_observation
    - reused_historical_oos
  strict_timestamp_order: true
  automatic_scientific_pass: false
  automatic_deployment_authorization: false

failed_research_policy:
  deletable: false
  reclassifiable_to_pass: false
  may_be_superseded_by_new_lineage: true
  original_verdict_remains_authoritative_for_original_run: true

human_intervention_map:
  AUTOMATIC:
    - hashes_schema_and_identity_checks
    - certification_currentness
    - preflight_and_stage_gate_calculation
    - immutable_historical_verdict_recording
    - scientific_PASS_only_candidate_review_eligibility
    - WFA_OOS_and_Monte_Carlo_calculation
    - account_rule_and_portfolio_calculation
    - forward_chronology_and_threshold_eligibility
    - canonical_forward_event_capture_after_source_validation
    - deterministic_predeclared_campaign_stop_and_attempt_blocking
    - same_contract_data_append_validation_and_content_identity
    - stale_approval_invalidation
    - monitoring_alerts_and_predeclared_safety_pause
  CODEX_ASSISTED:
    - source_discovery_and_claim_mapping
    - hypothesis_and_mechanics_proposals
    - authorized_implementation_and_tests
    - evidence_summaries_and_failure_diagnosis_explanation
    - separate_red_team_analysis
    - forward_portfolio_deployment_and_live_diagnostic_packages
  HUMAN_APPROVAL_REQUIRED:
    - source_and_hypothesis_admission
    - mechanics_interpretation
    - locked_acceptance_OOS_opening
    - candidate_disposition_after_separate_red_team_task
    - forward_start_and_forward_review
    - portfolio_disposition
    - deployment_mode_sizing_and_risk
    - semantic_methodology_data_and_implementation_changes
    - frozen_campaign_data_rebind_or_locked_boundary_change
    - discretionary_campaign_and_edge_family_abandonment_and_revisit
    - retirement_or_reenablement

invariants:
  - id: CODEX_CANNOT_AUTHORIZE_LIVE_DEPLOYMENT
    rule: AUTHORIZE_DEPLOYMENT and all live promotions require human initiation and prohibit Codex.
  - id: ACCOUNT_SUITABILITY_CANNOT_CREATE_SCIENTIFIC_VALIDITY
    rule: Account assessment requires scientific PASS and writes only ACCOUNT_SUITABILITY_STATE.
  - id: ACCOUNT_SUITABILITY_CANNOT_CREATE_CANDIDATE_STATUS
    rule: Candidate creation has no account-suitability prerequisite and account assessment cannot create CANDIDATE_STRATEGY.
  - id: RESEARCH_OBJECT_DEPENDENCIES_ARE_ACYCLIC
    rule: Downstream research-object dependencies contain no cycle, including Candidate Strategy and Account Suitability.
  - id: RESEARCH_OBJECT_MUTABILITY_IS_CANONICAL_AND_SEPARATE_FROM_CURRENTNESS
    rule: Every canonical object has an exact mutability contract; staleness blocks current use without mutating immutable historical evidence.
  - id: CANONICAL_TRANSITION_GRAPH_FAILS_CLOSED
    rule: The transition ID set, every from/to edge, and every applicable-stage scope are exact for this policy version; additions require a new reviewed policy version.
  - id: CANONICAL_TRANSITION_EFFECT_CONTRACTS_FAIL_CLOSED
    rule: Every canonical transition has one exact state-effect map; unknown, additional, missing, or alternate effect fields and values are prohibited.
  - id: PROTECTED_DEPLOYMENT_INGRESS_FAILS_CLOSED
    rule: Only AUTHORIZE_DEPLOYMENT, PROMOTE_SHADOW_TO_SMALL_LIVE, and PROMOTE_SMALL_LIVE_TO_LIVE may enter their respective protected stages; operational side-axis events are not ingress.
  - id: HISTORICAL_CANDIDATE_CANNOT_IMPLY_LIVE_AUTHORIZATION
    rule: No direct transition exists from HISTORICAL_CANDIDATE_REVIEW to SHADOW, SMALL_LIVE, or LIVE.
  - id: HISTORICAL_VERDICT_RECORDING_DOES_NOT_CREATE_CANDIDATE_STATUS
    rule: Recording PASS, FAIL, or NEEDS_MANUAL_REVIEW changes only SCIENTIFIC_STATE and remains in FULL_HISTORICAL_VALIDATION.
  - id: HISTORICAL_FAIL_CANNOT_ENTER_CANDIDATE_REVIEW
    rule: ENTER_HISTORICAL_CANDIDATE_REVIEW accepts scientific PASS only; immutable FAIL remains failure evidence.
  - id: NEEDS_MANUAL_REVIEW_REQUIRES_GOVERNED_RESOLUTION
    rule: NEEDS_MANUAL_REVIEW remains fail-closed and cannot enter candidate review without governed distinct evidence resolving to scientific PASS.
  - id: FORWARD_INCUBATION_CANNOT_BE_HISTORICALLY_BACKFILLED
    rule: Forward observations must occur after plan start and historical_backfill is prohibited.
  - id: FORWARD_EVIDENCE_IS_ALPHAQUEST_CUSTODIED
    rule: External systems source events; AlphaQuest validates and owns canonical append-only Forward Observation records.
  - id: FAILED_RESEARCH_CANNOT_BE_DELETED_OR_RELABELED_PASS
    rule: Failed evidence is durable and the original run verdict is immutable.
  - id: METHODOLOGY_CHANGE_REQUIRES_DISTINGUISHABLE_IDENTITY
    rule: Semantic methodology change increments version and changes hash; old evidence keeps old identity.
  - id: MATERIAL_DATA_CHANGE_REQUIRES_DISTINGUISHABLE_LINEAGE
    rule: Material data change creates a new dataset identity or hash and new evidence lineage.
  - id: SEMANTIC_IMPLEMENTATION_CHANGE_INVALIDATES_DEPENDENCIES
    rule: Certification and mechanics approval become stale and current execution is blocked.
  - id: UNCERTAIN_IMPLEMENTATION_EQUIVALENCE_FAILS_CLOSED
    rule: Missing, failed, or uncertain equivalence follows the semantic path and blocks dependent currentness.
  - id: PROVEN_NONSEMANTIC_CHANGE_MAY_REUSE_EVIDENCE
    rule: An approved deterministic equivalence standard may preserve evidence admissibility and forward continuity through explicit lineage without claiming current machinery exists.
  - id: RED_TEAM_IS_SEPARATE_FROM_IMPLEMENTATION_OWNERSHIP
    rule: Red-team review is a separately recorded task and cannot approve implementation work.
  - id: SINGLE_HUMAN_INDEPENDENCE_IS_TASK_BASED
    rule: Independence requires separate context, task, provenance, and ownership, not a second human identity.
  - id: DETERMINISTIC_CAMPAIGN_STOP_REQUIRES_NO_HUMAN
    rule: AlphaQuest automatically marks EXHAUSTED and blocks attempts when a predeclared objective stop rule is satisfied.
  - id: VARIANT_FAILURE_DOES_NOT_EXHAUST_CAMPAIGN_WITH_REMAINING_BUDGET
    rule: A limited core, monkey, WFA, Monte Carlo, or acceptance FAIL ends its bound path but leaves a governed successor available when variant budget remains and no campaign-level stop applies.
  - id: CAMPAIGN_EXHAUSTION_REQUIRES_CAMPAIGN_LEVEL_RULE
    rule: EXHAUSTED requires a predeclared campaign-level condition such as consumed variant, research, search, or holdout budget, or campaign-wide opportunity, data, or execution infeasibility.
  - id: DISCRETIONARY_ABANDONMENT_AND_REVISIT_REQUIRE_HUMAN
    rule: Scientific campaign abandonment, edge-family abandonment, and revisit remain human-gated.
  - id: SAME_CONTRACT_DATA_APPEND_CANNOT_REBIND_FROZEN_RESEARCH
    rule: Routine append and content versioning are automatic, while frozen campaign rebinding and boundary changes remain governed decisions.
  - id: CODEX_CANNOT_OVERRIDE_DETERMINISTIC_GATE_FAILURE
    rule: Objective gate failures are owned by AlphaQuest and are not Codex-overridable.
  - id: HUMAN_CANNOT_OVERRIDE_MISSING_OBJECTIVE_EVIDENCE
    rule: Human judgment begins only after required objective evidence and checks pass.
  - id: OPERATING_MODEL_IDENTITY_IS_ENGINE_AND_METHODOLOGY_INDEPENDENT
    rule: Canonical identity is schema, policy version, and policy content hash; introduced-against engine and methodology values are non-normative provenance.
  - id: LIVE_PERFORMANCE_CANNOT_REWRITE_RESEARCH
    rule: Live evidence can create new research lineage only.
  - id: ONE_ATTEMPT_HAS_AT_MOST_ONE_RUN
    rule: Every additional execution uses a new attempt identity and preserves the parent lineage.
  - id: POLICY_DEFINITIONS_DO_NOT_CLAIM_RUNTIME_ENFORCEMENT
    rule: Entries marked POLICY_ONLY are contracts for later phases and explicitly claim no current runtime enforcement.
