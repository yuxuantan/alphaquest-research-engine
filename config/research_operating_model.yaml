schema: alphaquest.research-operating-model/v1
policy_version: "2026-09-01.2"
status: canonical
objective: >-
  Maximize the probability that an apparent historical edge survives unseen live
  trading by preserving causal, chronological, and approval boundaries.
optimization_target: unseen_live_survival_probability
explicit_non_target: historical_backtest_performance

identity:
  identity_fields:
    - policy_version
    - policy_sha256
  semantic_change_requires_new_policy_version: true
  historical_records_keep_original_policy_identity: true
  retroactive_rebinding_prohibited: true
  methodology_identity_is_separate: true
  current_methodology_version: "2026-08-14.2"
  methodology_changed_by_p1: false
  current_engine_contract: "2026.08.14.1"

actors:
  CODEX:
    kind: advisory_and_bounded_implementation_agent
    authority: proposal_and_authorized_execution_only
    may_approve_own_work: false
    may_override_deterministic_gate: false
    may_authorize_deployment: false
  ALPHAQUEST_DETERMINISTIC_ENGINE:
    kind: objective_facts_and_transition_prerequisites
    authority: compute_validate_bind_and_fail_closed
    may_exercise_judgment: false
    may_override_human_gate: false
  HUMAN_OWNER_RESEARCHER:
    kind: accountable_scientific_and_risk_owner
    authority: high_information_high_irreversibility_decisions
    single_human_repository_supported: true
    may_override_missing_objective_evidence: false
    may_override_deterministic_gate_failure: false
  EXTERNAL_SYSTEM:
    kind: market_data_broker_exchange_or_clock
    authority: observations_and_execution_events_only
    may_approve_research: false
    may_authorize_deployment: false

research_objects:
  - id: OBSERVATION
    represents: A source-bound market observation or research lead, not an edge claim.
    created_when: A source, anomaly, practitioner observation, or market event is recorded.
    mutability: append_only_until_promoted_then_frozen
    owner: HUMAN_OWNER_RESEARCHER
    evidence:
      - source_locator
      - capture_or_content_hash_when_available
      - observation_time
      - known_conflicts
    invalidated_by:
      - source_retraction
      - source_identity_failure
      - evidence_tampering
    downstream:
      - HYPOTHESIS
  - id: HYPOTHESIS
    represents: A falsifiable economic edge claim separated from mechanical expression.
    created_when: A proposal binds causal mechanism, null, falsifiers, information timing, and sources.
    mutability: proposal_mutable_accepted_artifact_immutable
    owner: HUMAN_OWNER_RESEARCHER
    evidence:
      - reviewed_source_artifact_hashes
      - hypothesis_hash
      - human_acceptance
      - research_objective_hash
    invalidated_by:
      - source_retraction_affecting_core_claim
      - causal_timeline_failure
      - duplicate_edge_determination
    downstream:
      - EDGE_FAMILY
      - CAMPAIGN
  - id: EDGE_FAMILY
    represents: Related hypotheses sharing one causal economic mechanism across research generations.
    created_when: The first accepted hypothesis declares a stable family identity.
    mutability: append_only_lineage_and_disposition
    owner: HUMAN_OWNER_RESEARCHER
    evidence:
      - member_hypothesis_hashes
      - family_disposition_history
      - research_budget
      - prior_failure_lineage
    invalidated_by:
      - identity_collision
      - lineage_tampering
    downstream:
      - CAMPAIGN
      - REVISIT_DECISION
  - id: CAMPAIGN
    represents: One governed test program for one economic edge under frozen objectives.
    created_when: One accepted hypothesis is admitted for implementation with one initial variant.
    mutability: append_only_variants_attempts_and_disposition
    owner: HUMAN_OWNER_RESEARCHER
    evidence:
      - campaign_yaml
      - duplicate_edge_review
      - economic_edge_fingerprint
      - research_objectives_hash
      - research_ledger_entries
    invalidated_by:
      - duplicate_edge_without_distinction
      - objective_identity_drift
      - authored_source_tampering
    downstream:
      - STRATEGY_VARIANT
      - ATTEMPT
  - id: STRATEGY_VARIANT
    represents: One value-independent mechanical expression of the campaign hypothesis.
    created_when: The initial expression is predeclared, or a reviewed predecessor FAIL unlocks one successor.
    mutability: frozen_after_publication
    owner: HUMAN_OWNER_RESEARCHER
    evidence:
      - config_hash
      - mechanics_rationale
      - parameter_space_declaration
      - predecessor_fail_hash_for_successors
      - strategy_certification_identity
    invalidated_by:
      - config_hash_drift
      - strategy_implementation_drift
      - certification_drift
    downstream:
      - ATTEMPT
      - MECHANICS_APPROVAL
  - id: ATTEMPT
    represents: One authored scientific intention to produce at most one immutable performance run.
    created_when: Original, replication, data refresh, methodology rerun, pre-PnL correction/declaration, or authorized rescue is frozen.
    mutability: pending_until_execution_then_immutable
    owner: HUMAN_OWNER_RESEARCHER
    evidence:
      - attempt_id
      - attempt_kind
      - parent_attempt_id_when_non_original
      - authored_config_hashes
      - reason_and_author
    invalidated_by:
      - duplicate_attempt_run
      - attempt_identity_reuse
      - parent_lineage_mismatch
    downstream:
      - RUN
      - HISTORICAL_VALIDATION_RESULT
  - id: RUN
    represents: One immutable execution of one attempt.
    created_when: The deterministic runner reserves and completes an unused attempt identity.
    mutability: immutable_after_completion
    owner: ALPHAQUEST_DETERMINISTIC_ENGINE
    evidence:
      - run_uid
      - test_run_id
      - attempt_id
      - engine_contract
      - config_hash
      - data_hash
      - methodology_version_and_hash
      - stage_artifacts
    invalidated_by:
      - artifact_hash_mismatch
      - incomplete_finalization
      - identity_mismatch
    downstream:
      - HISTORICAL_VALIDATION_RESULT
  - id: MECHANICS_APPROVAL
    represents: Human confirmation that implementation matches frozen causal mechanics, never profitability approval.
    created_when: Automated lane-correct evidence passes and a human reviews the deterministic sample.
    mutability: immutable_and_hash_bound
    owner: HUMAN_OWNER_RESEARCHER
    evidence:
      - approval_hash
      - reviewer
      - config_hash
      - data_hash
      - implementation_hash
      - certification_manifest_hash
      - sampling_policy_hash
    invalidated_by:
      - config_change
      - validation_data_change
      - semantic_or_uncertain_implementation_change
      - uncertified_implementation_identity
      - failed_equivalence_rebind
      - sampling_policy_change
    downstream:
      - HISTORICAL_VALIDATION_RESULT
  - id: HISTORICAL_VALIDATION_RESULT
    represents: Deterministic scientific and objective outcomes under exact historical identities.
    created_when: A run finalizes its staged ResultBundle and terminal verdict.
    mutability: immutable
    owner: ALPHAQUEST_DETERMINISTIC_ENGINE
    evidence:
      - result_bundle_hash
      - finalization_manifest_hash
      - scientific_validity_verdict
      - generic_objective_verdict
      - stage_results
      - acceptance_oos_evidence
    invalidated_by:
      - artifact_integrity_failure
      - missing_required_identity
      - finalization_reconciliation_failure
    downstream:
      - CANDIDATE_STRATEGY
      - ACCOUNT_SUITABILITY_ASSESSMENT
      - CAMPAIGN_DISPOSITION
      - EDGE_FAMILY_DISPOSITION
  - id: CANDIDATE_STRATEGY
    represents: A historically supported candidate approved after separate red-team task review; never account suitability or deployment authorization.
    created_when: Scientific PASS and generic objective eligibility where applicable receive a separate red-team task and human candidate disposition.
    mutability: immutable_review_with_currentness_recomputed
    owner: HUMAN_OWNER_RESEARCHER
    evidence:
      - candidate_review_hash
      - result_bundle_hash
      - mechanics_approval_hash
      - red_team_task_provenance
      - candidate_review_task_context
      - human_disposition
    invalidated_by:
      - any_bound_evidence_drift
      - certification_staleness
      - candidate_review_integrity_failure
    downstream:
      - FORWARD_INCUBATION_PLAN
      - PORTFOLIO_CANDIDATE
      - ACCOUNT_SUITABILITY_ASSESSMENT
  - id: FORWARD_INCUBATION_PLAN
    represents: Frozen chronological duration, sample, and abandonment contract for one candidate.
    created_when: A human starts incubation from one current approved candidate.
    mutability: immutable_plan_append_only_events
    owner: HUMAN_OWNER_RESEARCHER
    evidence:
      - plan_hash
      - candidate_review_hash
      - result_bundle_hash
      - config_hash
      - research_objectives_hash
      - started_at
    invalidated_by:
      - source_candidate_drift
      - plan_hash_mismatch
      - backdated_event
    downstream:
      - FORWARD_OBSERVATION
      - PORTFOLIO_CANDIDATE
  - id: FORWARD_OBSERVATION
    represents: The canonical AlphaQuest-custodied record of a genuinely later externally sourced market or paper/shadow observation.
    created_when: AlphaQuest validates source identity, post-start chronology, hashes, attachments, and reconciliation fields, then appends the record.
    mutability: append_only
    owner: ALPHAQUEST_DETERMINISTIC_ENGINE
    source_actor: EXTERNAL_SYSTEM
    evidence:
      - event_hash
      - previous_event_hash
      - occurred_at
      - content_addressed_attachment
      - trade_and_rule_reconciliation
    invalidated_by:
      - historical_backfill
      - non_increasing_time
      - broken_hash_chain
      - attachment_hash_drift
    downstream:
      - PORTFOLIO_CANDIDATE
      - DEPLOYMENT_PACKAGE
  - id: PORTFOLIO_CANDIDATE
    represents: A forward-reviewed candidate eligible for contribution and interaction analysis.
    created_when: Forward thresholds are met and a human forward review accepts continuation to portfolio review.
    mutability: immutable_binding_to_current_candidate_and_forward_evidence
    owner: HUMAN_OWNER_RESEARCHER
    evidence:
      - candidate_identity
      - forward_plan_and_journal_hashes
      - acceptance_oos_trade_hashes
      - portfolio_analysis_hash_when_multi_candidate
    invalidated_by:
      - candidate_or_forward_evidence_drift
      - portfolio_input_drift
    downstream:
      - ACCOUNT_SUITABILITY_ASSESSMENT
      - DEPLOYMENT_PACKAGE
  - id: ACCOUNT_SUITABILITY_ASSESSMENT
    represents: Independent side-axis exact-profile rule and payoff assessment; it cannot determine scientific validity or candidate status.
    created_when: The deterministic simulator has scientific PASS, sufficient appropriate unseen evidence, and an exact versioned account profile.
    mutability: immutable
    owner: ALPHAQUEST_DETERMINISTIC_ENGINE
    evidence:
      - profile_id_version_and_hash
      - trade_evidence_hash
      - cost_snapshot
      - simulation_seed_and_count
      - attestations
    invalidated_by:
      - scientific_evidence_drift
      - profile_hash_drift
      - trade_evidence_drift
      - missing_required_attestation
    downstream:
      - DEPLOYMENT_PACKAGE
  - id: DEPLOYMENT_PACKAGE
    represents: Human-authorized, hash-bound allocation and monitoring contract for a separate execution process.
    created_when: All objective prerequisites pass and a human records deployment authorization.
    mutability: immutable_decision_new_package_for_change
    owner: HUMAN_OWNER_RESEARCHER
    evidence:
      - deployment_decision_hash
      - candidate_and_forward_bindings
      - account_limits
      - allocation
      - rollback_and_kill_criteria
      - monitoring_thresholds
    invalidated_by:
      - upstream_binding_drift
      - account_rule_change
      - allocation_or_risk_change
      - authorization_withdrawal
    downstream:
      - LIVE_STRATEGY_INSTANCE
  - id: LIVE_STRATEGY_INSTANCE
    represents: One externally activated shadow, small-live, or live instance under one deployment package.
    created_when: A separate execution system activates a human-authorized deployment package.
    mutability: append_only_operations_new_package_for_semantic_or_risk_change
    owner: HUMAN_OWNER_RESEARCHER
    evidence:
      - deployment_package_hash
      - external_instance_id
      - activation_time
      - mode
      - monitoring_journal
    invalidated_by:
      - deployment_package_staleness
      - safety_gate_breach
      - broker_or_data_identity_failure
      - authorization_withdrawal
    downstream:
      - NEW_OBSERVATION_ONLY

state_axes:
  RESEARCH_LIFECYCLE_STAGE:
    question: Where is the research object in the end-to-end process?
    values:
      - DISCOVERY
      - HYPOTHESIS_REVIEW
      - APPROVED_FOR_IMPLEMENTATION
      - IMPLEMENTATION
      - MECHANICS_CAUSAL_REVIEW
      - HISTORICAL_SCREENING
      - FULL_HISTORICAL_VALIDATION
      - HISTORICAL_CANDIDATE_REVIEW
      - FORWARD_INCUBATION
      - FORWARD_REVIEW
      - PORTFOLIO_REVIEW
      - ACCOUNT_SUITABILITY_REVIEW
      - DEPLOYMENT_REVIEW
      - SHADOW
      - SMALL_LIVE
      - LIVE
      - MONITORING
  LIFECYCLE_DISPOSITION:
    question: Is work active, blocked, objectively exhausted, paused, or terminal without changing other axes?
    values:
      - ACTIVE
      - BLOCKED
      - EXHAUSTED
      - ABANDONED
      - PAUSED
      - RETIRED
      - SUPERSEDED
    terminal_values:
      - EXHAUSTED
      - ABANDONED
      - RETIRED
  SCIENTIFIC_STATE:
    question: Does evidence support the hypothesis under its bound methodology?
    values:
      - NOT_EVALUATED
      - EVALUATING
      - PASS
      - FAIL
      - NEEDS_MANUAL_REVIEW
    terminal_for_attempt:
      - PASS
      - FAIL
      - NEEDS_MANUAL_REVIEW
  IMPLEMENTATION_STATE:
    question: Is the implementation certified and current for the requested use?
    values:
      - NOT_IMPLEMENTED
      - DEVELOPMENT
      - AWAITING_CERTIFICATION
      - CERTIFIED_CURRENT
      - CERTIFICATION_STALE
      - DEPRECATED
      - RETIRED
      - QUARANTINED
  FORWARD_STATE:
    question: Is genuine chronological incubation current and reviewable?
    values:
      - NOT_STARTED
      - ACTIVE
      - ELIGIBLE_FOR_REVIEW
      - FAILED
      - RETIRED
      - NEEDS_MANUAL_REVIEW
  PORTFOLIO_STATE:
    question: Does the candidate add acceptable portfolio value under reviewed evidence?
    values:
      - NOT_REVIEWED
      - READY_FOR_HUMAN_REVIEW
      - ACCEPTED
      - REJECTED
      - NEEDS_MANUAL_REVIEW
  ACCOUNT_SUITABILITY_STATE:
    question: Is the candidate suitable for one exact account profile and cost snapshot?
    values:
      - NOT_ASSESSED
      - PASS
      - FAIL
      - NEEDS_MANUAL_REVIEW
  DEPLOYMENT_STATE:
    question: Has a human authorized a separate execution process?
    values:
      - NOT_REVIEWED
      - REVIEW_PENDING
      - APPROVED_FOR_MANUAL_DEPLOYMENT
      - REJECTED
      - PAUSED
      - RETIRED
      - NEEDS_MANUAL_REVIEW
  OPERATIONAL_STATE:
    question: Is an activated instance healthy under frozen monitoring rules?
    values:
      - NOT_RUNNING
      - HEALTHY
      - ALERT
      - RETIREMENT_REVIEW
      - PAUSED
      - STOPPED
  EVIDENCE_CURRENTNESS:
    question: Do all bound identities still match current bytes and prerequisites?
    values:
      - CURRENT
      - STALE
      - MISSING
      - HASH_MISMATCH
      - BLOCKED
  EDGE_FAMILY_DISPOSITION:
    question: Should research budget continue for this causal family?
    values:
      - CONTINUE
      - LOWER_PRIORITY
      - SUSPEND
      - ABANDON
      - REVISITABLE

terminology_mapping:
  - current: registry.active
    canonical_axis: RESEARCH_LIFECYCLE_STAGE
    canonical: pre_terminal_stage_with_ACTIVE_disposition
    compatibility: preserve
    note: Navigation label only; it is not scientific validity or package availability.
  - current: registry.review_queue
    canonical_axis: LIFECYCLE_DISPOSITION
    canonical: BLOCKED
    compatibility: preserve
    note: Navigation projection for missing, ambiguous, or pending human review evidence.
  - current: registry.candidate
    canonical_axis: RESEARCH_LIFECYCLE_STAGE
    canonical: HISTORICAL_CANDIDATE_REVIEW
    compatibility: preserve
    note: Existing label means an independently reviewed historical candidate, never live-ready.
  - current: registry.closed
    canonical_axis: LIFECYCLE_DISPOSITION
    canonical: ABANDONED_or_RETIRED
    compatibility: preserve
    note: Existing projection does not distinguish closure reasons; source evidence remains authoritative.
  - current: run.PASS_FAIL_NEEDS_MANUAL_REVIEW
    canonical_axis: SCIENTIFIC_STATE
    canonical: same_values
    compatibility: preserve
    note: Immutable per-run verdict; never use as deployment state.
  - current: StrategyPackageLifecycle
    canonical_axis: IMPLEMENTATION_STATE
    canonical: same_values_with_CERTIFIED_CURRENT_or_CERTIFICATION_STALE_computed_separately
    compatibility: preserve
    note: Package availability and certification currentness remain separate facts.
  - current: FactoryState.TERMINAL_PASS
    canonical_axis: SCIENTIFIC_STATE
    canonical: PASS_for_the_bound_factory_result_only
    compatibility: preserve
    note: It is not terminal for the end-to-end research lifecycle.
  - current: candidate_review.lifecycle_state_candidate
    canonical_axis: RESEARCH_LIFECYCLE_STAGE
    canonical: HISTORICAL_CANDIDATE_REVIEW
    compatibility: preserve
    note: Candidate review is independent of mechanics review and precedes forward incubation.
  - current: forward_incubation.ACTIVE_ELIGIBLE_FOR_REVIEW_FAILED_RETIRED_NEEDS_MANUAL_REVIEW
    canonical_axis: FORWARD_STATE
    canonical: same_values
    compatibility: preserve
    note: No forward event can create scientific PASS or deployment authorization.
  - current: portfolio.READY_FOR_HUMAN_REVIEW
    canonical_axis: PORTFOLIO_STATE
    canonical: READY_FOR_HUMAN_REVIEW
    compatibility: preserve
    note: Current portfolio output is verdict-neutral and automatic deployment is false.
  - current: account_assessment.PASS_FAIL_NEEDS_MANUAL_REVIEW
    canonical_axis: ACCOUNT_SUITABILITY_STATE
    canonical: same_values
    compatibility: preserve
    note: Exact-profile result only; cannot create scientific validity.
  - current: deployment.APPROVED_FOR_MANUAL_DEPLOYMENT_REJECTED_NEEDS_MANUAL_REVIEW
    canonical_axis: DEPLOYMENT_STATE
    canonical: same_values
    compatibility: preserve
    note: Existing service records a decision but has execution capability none.
  - current: monitoring.HEALTHY_ALERT_RETIREMENT_REVIEW
    canonical_axis: OPERATIONAL_STATE
    canonical: same_values
    compatibility: preserve
    note: Monitoring can request review or pause but cannot rewrite research.
  - current: FROZEN
    canonical_axis: EVIDENCE_CURRENTNESS
    canonical: immutable_identity_not_a_lifecycle_stage
    compatibility: normalize_in_new_policy_only
    note: Frozen describes mutability, not scientific or deployment state.
  - current: PROMOTED
    canonical_axis: none
    canonical: explicit_named_transition_required
    compatibility: avoid_for_new_contracts
    note: The unqualified word is ambiguous across candidate, forward, portfolio, and deployment boundaries.

account_suitability_policy:
  relationship_to_lifecycle: independent_side_axis
  normal_deployment_gate_stage: ACCOUNT_SUITABILITY_REVIEW
  may_be_computed_before_normal_gate: true
  prerequisites:
    - scientific_pass
    - sufficient_appropriate_unseen_evidence
    - exact_versioned_account_profile
  writes_only: ACCOUNT_SUITABILITY_STATE
  cannot_create:
    - SCIENTIFIC_STATE
    - CANDIDATE_STRATEGY
    - FORWARD_STATE
    - PORTFOLIO_STATE
    - DEPLOYMENT_STATE
  interpretation: It may measure destination-specific usefulness but cannot establish generic scientific or candidate validity.

independence_policy:
  repository_model: single_human_owner
  distinct_human_identities_required: false
  minimum_human_identities_required: 1
  separation_basis:
    - task_context
    - provenance
    - implementation_ownership
    - deterministic_evaluation_ownership
    - red_team_task
  required_sequence:
    - bounded_implementation_task
    - deterministic_alphaquest_evaluation
    - fresh_separate_red_team_task
    - human_owner_final_disposition
  codex_may_approve_own_work: false
  deterministic_results_overridable: false

transitions:
  - id: RECORD_RESEARCH_LEAD
    from_stage: DISCOVERY
    to_stage: DISCOVERY
    initiator: CODEX
    evidence_required: [source_locator, observation, uncertainty]
    deterministic_checks: [schema_valid, no_campaign_mutation]
    codex: ALLOWED_PROPOSAL_ONLY
    human_approval_required: false
    alphaquest_automatic: false
    reversible: false
    invalidated_by: [source_identity_failure]
    implementation_status: existing_partial
  - id: ADMIT_HYPOTHESIS_FOR_IMPLEMENTATION
    from_stage: HYPOTHESIS_REVIEW
    to_stage: APPROVED_FOR_IMPLEMENTATION
    initiator: HUMAN_OWNER_RESEARCHER
    evidence_required: [reviewed_sources, falsifiable_hypothesis, null, causal_timeline, duplicate_review, objectives]
    deterministic_checks: [all_required_fields, hash_bindings, no_duplicate_without_distinction]
    codex: PROPOSAL_ONLY
    human_approval_required: true
    alphaquest_automatic: false
    reversible: false
    invalidated_by: [source_retraction, hypothesis_hash_drift]
    implementation_status: existing
  - id: START_IMPLEMENTATION
    from_stage: APPROVED_FOR_IMPLEMENTATION
    to_stage: IMPLEMENTATION
    initiator: HUMAN_OWNER_RESEARCHER
    evidence_required: [accepted_hypothesis_hash, approved_mechanics_intent_or_engineering_handoff]
    deterministic_checks: [certified_catalog_or_handoff_path, information_boundary]
    codex: ALLOWED_AFTER_HUMAN_SCOPE_APPROVAL
    human_approval_required: false
    alphaquest_automatic: false
    reversible: true
    invalidated_by: [scope_change, hypothesis_hash_drift]
    implementation_status: existing_partial
  - id: SUBMIT_MECHANICS_FOR_REVIEW
    from_stage: IMPLEMENTATION
    to_stage: MECHANICS_CAUSAL_REVIEW
    initiator: CODEX
    evidence_required: [implementation_hash, certification_manifest, required_tests, deterministic_validation_evidence]
    deterministic_checks: [certification_current, required_tests_pass, lane_correct, no_unresolved_errors]
    codex: ALLOWED_TO_PREPARE_NOT_APPROVE
    human_approval_required: false
    alphaquest_automatic: false
    reversible: true
    invalidated_by: [source_change, config_change, validation_data_change]
    implementation_status: existing
  - id: APPROVE_MECHANICAL_INTERPRETATION
    from_stage: MECHANICS_CAUSAL_REVIEW
    to_stage: HISTORICAL_SCREENING
    initiator: HUMAN_OWNER_RESEARCHER
    evidence_required: [hash_bound_validation_approval, deterministic_sample_review, certification_identity]
    deterministic_checks: [all_automated_checks_pass, sample_complete, hashes_current]
    codex: PROHIBITED
    human_approval_required: true
    alphaquest_automatic: false
    reversible: false
    invalidated_by: [semantic_implementation_change, config_change, data_change, certification_change, sampling_policy_change]
    implementation_status: existing
  - id: RUN_HISTORICAL_SCREENING
    from_stage: HISTORICAL_SCREENING
    to_stage: FULL_HISTORICAL_VALIDATION
    initiator: ALPHAQUEST_DETERMINISTIC_ENGINE
    evidence_required: [unused_attempt_id, current_mechanics_approval, current_config_data_methodology_bindings]
    deterministic_checks: [preflight_pass, stage_gates_pass, one_run_per_attempt]
    codex: ALLOWED_TO_REQUEST_AUTHORED_RUN_ONLY
    human_approval_required: false
    alphaquest_automatic: true
    reversible: false
    invalidated_by: [identity_drift, incomplete_run]
    implementation_status: existing
  - id: OPEN_LOCKED_ACCEPTANCE_OOS
    from_stage: FULL_HISTORICAL_VALIDATION
    to_stage: FULL_HISTORICAL_VALIDATION
    initiator: HUMAN_OWNER_RESEARCHER
    evidence_required: [all_pre_acceptance_gates_pass, frozen_mechanics, unopened_holdout_identity]
    deterministic_checks: [holdout_unconsumed, pre_acceptance_complete, hashes_current]
    codex: PROHIBITED
    human_approval_required: true
    alphaquest_automatic: false
    reversible: false
    invalidated_by: [holdout_prior_access, identity_drift]
    implementation_status: policy_explicit_existing_gate_partial
  - id: RECORD_HISTORICAL_VERDICT
    from_stage: FULL_HISTORICAL_VALIDATION
    to_stage: HISTORICAL_CANDIDATE_REVIEW
    initiator: ALPHAQUEST_DETERMINISTIC_ENGINE
    evidence_required: [complete_finalized_result_bundle]
    deterministic_checks: [recompute_metrics, replay_criteria, artifact_integrity]
    codex: PROHIBITED_TO_DECIDE
    human_approval_required: false
    alphaquest_automatic: true
    reversible: false
    invalidated_by: [finalization_integrity_failure]
    implementation_status: existing
  - id: APPROVE_HISTORICAL_CANDIDATE
    from_stage: HISTORICAL_CANDIDATE_REVIEW
    to_stage: HISTORICAL_CANDIDATE_REVIEW
    initiator: HUMAN_OWNER_RESEARCHER
    evidence_required: [scientific_pass, generic_objective_eligibility_when_applicable, separate_red_team_task, current_mechanics_approval]
    deterministic_checks: [candidate_eligibility, task_and_provenance_separation, hash_currentness]
    codex: PROHIBITED_TO_APPROVE
    human_approval_required: true
