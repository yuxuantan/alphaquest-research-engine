name: CI

on:
  push:
  pull_request:

env:
  PYTHON_VERSION: "3.12.14"

jobs:
  lint:
    name: Lint and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: constraints/dev.txt
      - name: Install pinned reference environment
        run: python -m pip install -c constraints/dev.txt -e ".[dev,studio,dashboard]"
      - run: make lint

  documentation:
    name: Documentation validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: make docs-check

  smoke:
    name: CLI and smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: constraints/dev.txt
      - name: Install pinned reference environment
        run: python -m pip install -c constraints/dev.txt -e ".[dev,studio,dashboard]"
      - run: alphaquest --help
      - run: make smoke

  python-tests:
    name: Governed Python suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: constraints/dev.txt
      - name: Install pinned reference environment
        run: python -m pip install -c constraints/dev.txt -e ".[dev,studio,dashboard]"
      - name: Install browser for the no-code Studio flow
        run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests

  execution-system-tests:
    name: Execution-system suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: constraints/dev.txt
      - name: Install pinned reference environment
        run: python -m pip install -c constraints/dev.txt -e ".[dev,studio,dashboard]"
      - run: python -m pytest -q execution_system/tests

  studio-ui:
    name: Studio UI typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.8.0"
          cache: npm
          cache-dependency-path: studio-ui/package-lock.json
      - run: npm --prefix studio-ui ci
      - run: make studio-ui-check
