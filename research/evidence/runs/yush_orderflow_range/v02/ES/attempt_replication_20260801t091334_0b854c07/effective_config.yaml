research_metadata:
  authoring_contract: alphaquest.campaign-draft/v1
  mechanic_signature: 9ddb0706f57b5dc03fcd0a35abc1ca270cec84e3fdbd48e0e575081e6536fc47
  mechanics_review_required: true
  mechanics_review_version: 1
  mechanics_review:
    mechanic_expresses_edge: 'Freeze the exact developing VAH for a potential short
      or VAL for a potential long only when that edge contains a causal institutional
      footprint: either an execution burst at or above the prior-twenty-session 99.5th
      percentile or top-decile absolute developing delta. Trade only after price sweeps
      the frozen edge and a completed bar closes back inside, unless the completed
      rolling windows show a direction-aligned breakout trend.'
    entry_logic_rationale: Market levels remain optional context and never qualify
      an AOI. A completed value edge needs at least one institutional footprint. Developing
      volume and delta use four-tick ES rows. Value starts at the lower-tied maximum-volume
      POC and follows MotiveWave Standard by comparing the next two rows below with
      the next two above, adding the higher-volume pair until at least seventy percent
      is included; an exact pair-volume tie selects the lower pair. VAL is the lower
      boundary of the lowest included row and VAH is the upper boundary of the highest
      included row. Delta qualification uses the included boundary row rather than
      the first row outside value. Large executions sum fixed 100 ms cells aligned
      to 09:30 separately for each price tick and aggressor side. The threshold is
      the 99.5th percentile of those cells in the prior twenty sessions, so it identifies
      exceptional activity without an arbitrary contract count and excludes the current
      session. The alternative footprint is absolute cumulative delta at the edge's
      one-point bin at or above the nearest-rank ninetieth percentile of observed
      developing profile bins. A two-tick excursion beyond the frozen edge starts
      a sweep; within three completed bars, price must close at least one tick back
      inside. A bullish breakout trend vetoes shorts and a bearish breakout trend
      vetoes longs; the opposite trend does not veto the reversal. After confirmation,
      place a fixed trigger one tick inside the frozen edge, active only from the
      next ordered trade event. Each directional edge price may fill once per session.
    stop_loss_rationale: Place the protective stop two ticks beyond the highest or
      lowest price observed from sweep through entry; reject distances below six ticks
      or above the smaller of sixty ticks and 1.25 times causal ATR14.
    target_exit_rationale: Require midpoint reward of at least 1R and opposite value-edge
      reward of at least 2R before entry. Every accepted entry contains exactly two
      contracts. Exit one at the frozen midpoint, move the remaining contract's stop
      one tick beyond entry, and exit that contract at the opposite value edge or
      after twelve bars.
    profitability_rationale: The proposed edge is that a failed excursion beyond a
      value boundary carrying evidence of exceptional prior activity reveals rejection;
      participants caught outside value may help price rotate first to the profile
      midpoint frozen when the AOI qualified and, conditionally, to its opposite value
      edge.
    known_failure_modes: A sweep can be a brief pause before genuine continuation;
      developing profiles can change after the causal snapshot; burst classification
      can miss institutionally split execution; percentile estimates can lag abrupt
      volume-regime changes; the trend veto can confirm only after completed windows;
      and cost-aware sizing can reduce a valid setup to no executable contract.
    session_logic_rationale: Evaluate the same predeclared range-edge mechanic in
      two liquid RTH windows, 09:33-11:30 and 13:30-15:30 New York. Core signal evaluation
      has no generic daily trade cap, daily-loss gate or cooldown; account and prop-risk
      controls remain a separate execution layer. Flatten at 15:55.
    causal_availability: Profiles, trend state, ATR, delta bins and signal bars publish
      only after the relevant three-minute close. Orders created from a close activate
      no earlier than the next ordered trade event. Execution bursts become available
      only when a side, price-range or time-gap break completes them. MotiveWave Standard
      value-area pairs use only volume published through that completed bar. The AOI
      and value-profile objectives freeze at the completed bar where the exact displayed
      VAH or VAL boundary gains a qualifying footprint in its included one-point row.
      The burst threshold uses only the prior twenty completed RTH sessions. Later
      developing-profile movement cannot rewrite an existing sweep episode or its
      objectives.
    pre_test_decision: approve_for_testing
  timeframe_rationale: Three-minute bars define the developing profiles, rolling thirty-minute
    trend-veto windows, sweep and failure sequence, ATR14, order expiry and maximum
    hold. Entries are restricted to 09:33-11:30 and 13:30-15:30 New York, and all
    positions flatten at 15:55.
  validation_gate:
    required: true
    lane: event_replay
    parameter_mode: declared_defaults
    manual_review_random_sample_size: 5
    manual_review_seed: 0
    data_subset:
      start_date: '2026-05-08'
      end_date: '2026-05-22'
    evidence_dir: /Users/yx/Desktop/alphaquest-research-engine/research/evidence/runs/yush_orderflow_range/v02/ES/mechanics_validation_replication_20260801t091334_0b854c07/validation_runs/core
    approval_path: /Users/yx/Desktop/alphaquest-research-engine/research_artifacts/validation_approvals/yush_orderflow_range/replication_20260801t091334_0b854c07/v02/approval.json
    minimum_trade_samples: 5
  parent_variant_id: v02
  follow_up:
    schema: alphaquest.follow-up-attempt/v1
    attempt_id: replication_20260801t091334_0b854c07
    attempt_kind: replication
    parent_attempt_id: pre_pnl_mechanics_correction_20260801t050917_eb8e278f
