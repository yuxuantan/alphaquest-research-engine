research_metadata:
  authoring_contract: alphaquest.campaign-draft/v1
  mechanic_signature: cc8745aefd2f96853f34fc8577326cbb89683dda48cc5603a312308e0ab68b46
  mechanics_review_required: true
  mechanics_review_version: 1
  mechanics_review:
    mechanic_expresses_edge: Freeze an exact developing MotiveWave Standard VAH for a potential short or VAL for a potential
      long when it overlaps at least one causal context source within one third of the causal three-minute ATR outward. Eligible
      sources are a prior-20-session q99.9 exceptional aggressive-volume cell, a direction-aligned top-decile developing profile-delta
      row, or a compatible completed PDH/PDL, causal ONH/ONL, or completed 30-second ORH/ORL. Shorts require positive delta
      or buy aggression at or above VAH and upper market levels; longs require negative delta or sell aggression at or below
      VAL and lower market levels. A separate post-AOI large-execution or completed-bar delta observation must confirm the
      failed auction; the observation that formed the AOI cannot also trigger its order.
    entry_logic_rationale: An ordered trade at or inside the frozen edge arms one crossing. A later ordered trade reaching
      the ATR-normalized sweep distance records one sweep, which becomes actionable only after that three-minute bar completes.
      Continuous trading outside the edge cannot repeatedly create sweep bars. Any qualifying exceptional-volume burst from
      the current RTH session may arm an edge; burst state resets at the next RTH session. The AOI has no clock expiry; a
      genuinely newer qualifying burst may supersede an unswept AOI, with both identities and timestamps audited. Once a sweep
      episode begins, its frozen edge and value-area targets cannot be superseded. The AOI is invalidated and any pending
      limit is cancelled when the developing VAH or VAL leaves the frozen AOI. A new burst can re-arm the same price after
      the prior AOI retires. A context source is distinct from entry confirmation; a later direction-matched q99.9 burst with
      a different burst ID, or a later completed bar whose outward row is direction-aligned and top-decile by absolute delta,
      must occur after AOI creation and within the episode confirmation window. Every AOI and confirmation uses the one-third-ATR
      radius frozen when the AOI was created. The one-tick MotiveWave Standard profile warms for three completed bars after
      09:30 and then accumulates continuously through RTH without a 13:30 reset. As soon as the separate confirmation exists
      after a completed sweep, place a resting limit one tick outside the frozen value edge; no reclaim is required. Before
      order creation, require gross reward to the frozen midpoint to be at least equal to structural risk to the sweep-extreme
      stop. Commissions, slippage, and the opposite-edge target are deliberately excluded from this pre-order ratio. The limit
      has no bar or clock expiry. If ordered price reaches its frozen stop before a fill, cancel it; a subsequent event spanning
      both prices is conservatively stop-first.
    stop_loss_rationale: Place the protective stop at the ordered sweep-bar extreme without an added tick buffer. Reject structural
      risk below two ticks or above the selected causal ATR multiple. ES remains the signal and order-flow instrument; executable
      sizing uses MES economics. Quantity is the floor of 0.4 percent of current net liquidation divided by all-in risk per
      MES. A valid signal is rejected only when one MES, including one adverse stop-fill tick and round-turn commission, exceeds
      that 0.4-percent ceiling.
    target_exit_rationale: At AOI creation, freeze the value-area midpoint and opposite value edge from the same causal profile
      snapshot. Exit half at the midpoint and the remainder at the opposite edge. The pre-order gate considers only gross
      reward to the midpoint and requires at least one-to-one against structural stop risk; it does not use net weighted reward.
      The remainder retains the existing post-target-one protective stop and maximum-hold rules.
    profitability_rationale: The candidate edge is local auction rejection where developing value overlaps exceptional outward
      aggression, direction-aligned delta concentration, or a completed structural extreme, and a distinct later order-flow
      observation confirms absorption. Event-order crossing memory prevents false repeated sweeps; direction, the causal one-third-ATR
      context radius, source availability, a minimum one-to-one gross midpoint payoff and the structural-stop ceiling are
      the opportunity filters retained.
    known_failure_modes: A failed excursion may still precede continuation; market-level-only AOIs may be common but cannot
      trade without separate dynamic confirmation; cross-sectional delta thresholds can be unstable early in the session profile;
      a three-bar warmup is noisier than a five-bar warmup; the afternoon profile can remain dominated by morning volume;
      one-tick profile rows can make value edges more sensitive to local volume; retaining all current-session bursts may
      admit decayed information; the ATR-scaled radius expands materially in volatile sessions; immediate order activation
      removes the former reclaim filter; supersession can replace a valid but slow-developing unswept AOI; removing the trend
      veto permits reversals during strong directional sessions; an unfilled limit can remain pending for a long interval
      when neither its entry nor stop trades; and the opposite-edge remainder can give back midpoint gains before completion.
    session_logic_rationale: Evaluate the same frozen mechanic in two liquid RTH windows, 09:39-11:30 and 13:39-15:30 New
      York. One causal RTH volume and delta profile accumulates from 09:30 through both windows without a 13:30 reset. Strategy
      mechanics have no daily trade cap; account and prop-risk controls remain separate. Executable evidence begins on the
      MES launch date, 2019-05-06. Flatten at 15:55.
    causal_availability: The continuous RTH profile, profile delta and ATR use completed bars only; profile state is not cleared
      at 13:30. Prior-day levels use the completed prior RTH session; ONH/ONL use only the causal overnight summary supplied
      to the session; ORH/ORL become eligible only after the fixed 30-second opening range is complete. Burst thresholds use
      prior completed sessions. Crossing memory consumes only ordered events observed after the AOI froze. Dynamic confirmation
      must have a timestamp or completed-bar index later than AOI creation and a distinct source identity. A sweep episode
      publishes at the close of its event's three-minute bar. Once the separate confirmation is available, the strategy checks
      the gross midpoint reward ratio and arms the outside-edge resting limit for subsequent ordered events without requiring
      a reclaim. Every later ordered event checks stop-before-entry invalidation before execution. The midpoint and opposite
      edge come only from the profile snapshot frozen when the AOI was created.
    pre_test_decision: approve_for_testing
  timeframe_rationale: Three-minute bars publish the developing profile, ATR and sweep episode. Ordered canonical trade events
    prove the inside-to-outside crossing without using an unknowable OHLC path. Separate causal order flow arms a resting
    limit immediately; it remains live until fill or price reaches the initial stop. Entries are restricted to 09:39-11:30
    and 13:39-15:30 New York, and all positions flatten at 15:55.
