variant_distinctions:
  v01:
    mechanic: Build a causal AOI around developing VAL or VAH plus the strongest available market, local-delta, and large-trade
      categories; reset eligibility whenever the exact AOI price envelope or selected confluence identity changes, then require
      a prior reversal, a fresh directed tap, and a new post-tap trigger.
    material_difference: As v01 this is the single frozen baseline mechanic; any later variant is prohibited until this implementation
      passes manual mechanics review and then receives a terminal FAIL in the test suite.
    mechanic_signature: 40196dae316c39929e8caf69137bbb9efae1f95af75d1994bda2375a37580fb1
  v02:
    mechanic: Express the same absorption-to-fair-value hypothesis through a failed auction rather than a repeated AOI tap.
      Freeze the causal developing value boundary, nearby known reference, and POC before the excursion; require directed
      aggression outside value to fail and price to reclaim the boundary before considering an entry.
    material_difference: 'v01 required an exact multi-source AOI fingerprint, a prior reversal, a fresh second tap, and a
      two-tick stop-entry trigger, then managed toward midpoint and opposite value edge. v02 removes AOI lineage and tap counting
      entirely: it freezes one value boundary, requires a measurable outside excursion with outward aggression, enters only
      after a one-tick reclaim, stops beyond the excursion extreme, and targets the frozen POC with a fixed time exit.'
    mechanic_signature: 2595e548d0eb42bfd6ed029f9b88c07bcc1ca3c0f19573d00387f3019db04da1
  v03:
    mechanic: Retain the same failed-auction return-to-fair-value edge while allowing independent opportunities through fresh
      footprint identities, explicit inside-to-outside crossings, and causal AOI expiry. Normalize sweep, reclaim, structural
      stop, and trend distances by the ATR known at each completed bar.
    material_difference: v02 held one AOI identity until the developing edge moved, treated static distances as universal,
      and could suppress later same-price opportunities after a stale or consumed setup. v03 creates an identity from the
      fresh footprint generation, edge, side, and profile epoch; retires it after one sweep/fill or thirty minutes; requires
      a new crossing; adds a separate afternoon profile; and uses ATR-scaled geometry.
    mechanic_signature: 0ef08b6edfed91fed6a9d345fc80aa12db8f1a44ef8ec31c849c8207a6dd7806
  v04:
    mechanic: At every completed three-minute boundary, independently attempt a short AOI at the latest VAH and a long AOI
      at the latest VAL. The AOI exists only when a prior-20-session q99.9 MotiveWave-compatible consecutive aggressive-volume
      sequence of either side and/or a sign-agnostic top-decile absolute session-anchored four-tick delta cell, or a PDH,
      PDL, PDC, ONH, ONL, ORH, or ORL lies within one third of causal ATR above or below that edge. A market level may independently
      qualify the AOI. The repository availability policy selected this as the sole active, unused certified event successor;
      observed PnL did not select its parameters.
    material_difference: 'Replaces certified event entry yush_adaptive_orderflow_range_v3 with yush_adaptive_orderflow_range_v4,
      stop event_fill_time_sweep_to_entry_extreme_stop, and target event_frozen_midpoint_two_ticks_outside_opposite_value_area_scale_out.
      Per-bar VAH and VAL AOIs built from a nearby market level, exceptional volume, or sign-agnostic four-tick delta within
      one-third ATR, followed by an ordered sweep, a separate post-sweep big-trade or delta confirmation, an AOI-zone reclaim
      stop entry, and a fill-time sweep-to-entry structural stop. The predecessor failed limited_core_grid_test/summary.percentage_profitable_iterations:
      actual 0.0 did not meet required >= 0.7 This is a newly frozen expression of the same economic edge, not a parameter-only
      rename or a post-hoc reinterpretation of predecessor PnL.'
    mechanic_signature: 02cbd4808b202e8245dbc0e1ecb312fc2078000a0221481dab42f45e4d728edd
