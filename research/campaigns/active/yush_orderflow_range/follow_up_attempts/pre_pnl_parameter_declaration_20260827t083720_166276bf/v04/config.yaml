research_metadata:
  authoring_contract: alphaquest.campaign-draft/v1
  mechanic_signature: 02cbd4808b202e8245dbc0e1ecb312fc2078000a0221481dab42f45e4d728edd
  mechanics_review_required: true
  mechanics_review_version: 1
  mechanics_review:
    mechanic_expresses_edge: At every completed three-minute boundary, independently attempt a short AOI at the latest VAH
      and a long AOI at the latest VAL. The AOI exists only when a prior-20-session q99.9 MotiveWave-compatible consecutive
      aggressive-volume sequence of either side and/or a sign-agnostic top-decile absolute session-anchored four-tick delta
      cell, or a PDH, PDL, PDC, ONH, ONL, ORH, or ORL lies within one third of causal ATR above or below that edge. A market
      level may independently qualify the AOI.
    entry_logic_rationale: Each AOI applies only to the next three-minute bar and is rebuilt at the following boundary from
      the then-latest VAH or VAL and confluences. An ordered event at or inside the edge arms the crossing; a later event
      at the ATR-normalized sweep distance completes a sweep when that bar closes. The completed sweep waits for a distinct
      later q99.9 large execution or newly accumulated top-decile absolute four-tick delta cell. For a short the confirmation
      label must be strictly above the frozen AOI-zone bottom; for a long it must be strictly below the frozen AOI-zone top.
      Only then is the stop-market reclaim entry armed two ticks beyond that boundary. There is no AOI supersession model
      or intended-stop invalidation before fill, and the confirmed entry order has no clock expiry.
    stop_loss_rationale: The order is submitted without a predeclared stop. On the exact causal fill event, after that event
      has updated the path, resolve the stop two ticks beyond the adverse extreme observed from the entire sweep bar through
      the entry event, inclusive. Validate the minimum and causal-ATR maximum, size from the resolved risk, and create the
      position only after the stop is valid.
    target_exit_rationale: When a per-bar AOI is created, retain its value-area midpoint and opposite edge for any setup swept
      from that AOI. Exit half at the midpoint and the remainder two ticks outside the opposite value-area edge; two ticks
      below frozen VAL for a short and two ticks above frozen VAH for a long. The one-to-one gross midpoint reward gate is
      evaluated on the fill event against the resolved sweep-to-entry stop.
    profitability_rationale: The candidate edge is rejection of a developing value edge colocated with exceptional executed
      volume or absolute delta concentration. Per-bar rebuilding keeps the edge current; the ordered sweep plus a separate
      post-sweep order-flow observation requires fresh evidence before the reclaim trigger becomes executable.
    known_failure_modes: Per-bar AOIs may churn as developing value moves; session-old bursts may be stale; early cross-sectional
      delta ranks may be unstable; direction-neutral confluence may be unrelated to reversal direction; a market level alone
      may be too common to identify absorption; a wide AOI zone may reduce fills; the separate confirmation can arrive late
      or never arrive; a pending order can remain live for a long time; the sweep-to-entry extreme can produce a wide stop;
      stop-market entry can gap; and requiring two ticks beyond the opposite value-area edge can reduce final-target fills
      and give back midpoint gains.
    session_logic_rationale: Build causally from one RTH profile beginning at 09:30 without a 13:30 reset. Entries remain
      restricted to 09:39-11:30 and 13:39-15:30 New York, with forced flatten at 15:55. Strategy mechanics have no daily trade
      cap; account controls remain separate.
    causal_availability: The latest profile, four-tick delta profile and ATR use completed bars only. Each newly published
      boundary builds the AOIs visible during the next bar. Large executions must already be causally qualified. Ordered sweep
      events occur after AOI creation. Confirmation cannot reuse an observation at or before the ordered sweep event. A later
      same-bar observation may qualify, but the stop-entry order cannot exist until that sweep bar completes. The stop is
      resolved only on the actual fill event from extrema accumulated from the sweep bar through that event, before sizing
      or position creation. Targets come from the AOI-time profile.
    pre_test_decision: approve_for_testing
  timeframe_rationale: Each completed three-minute bar causally republishes the developing profile and ATR, then builds independent
    VAH and VAL AOIs for the next bar. Ordered events prove the inside-to-outside sweep. A distinct big-trade or newly accumulated
    delta observation after the sweep event must confirm at the required side of the AOI zone before the reclaim stop order
    can exist.
