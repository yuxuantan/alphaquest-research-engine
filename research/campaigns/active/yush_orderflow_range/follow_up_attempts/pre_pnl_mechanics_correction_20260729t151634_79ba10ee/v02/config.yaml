research_metadata:
  authoring_contract: alphaquest.campaign-draft/v1
  mechanic_signature: 9ddb0706f57b5dc03fcd0a35abc1ca270cec84e3fdbd48e0e575081e6536fc47
  mechanics_review_required: true
  mechanics_review_version: 1
  mechanics_review:
    mechanic_expresses_edge: Identify a pre-existing high-confluence range edge while the completed regime is non-trending,
      observe price sweep that edge, and enter only after the excursion fails to produce continuation and price closes back
      inside. Extreme delta and large execution bursts remain corroborating evidence rather than mandatory gates.
    entry_logic_rationale: Freeze an AOI when it scores at least three during a completed balanced or undefined non-trending
      regime. Upper-quarter AOIs may create shorts and lower-quarter AOIs may create longs; market-level names cannot override
      their causal location within the frozen profile. Refreshing an AOI during an undefined regime requires a new causal
      score-three observation, while an older immutable AOI remains eligible for at most three undefined bars. Invalidate
      immediately on a directional trend. Require a two-tick minimum sweep no deeper than the smaller of forty ticks and 1.25
      times causal ATR14, followed by failure within three bars. Failure means a completed close at least one tick back inside
      the frozen edge. Extreme same-direction delta, a two-hundred-contract burst, and sweep-to-failure aggregate delta remain
      visible as corroborating diagnostics but do not gate confirmation. After that completed failure, use a fixed entry trigger
      one tick inside the frozen AOI edge; the order cannot activate before the next ordered trade event.
    stop_loss_rationale: Place the protective stop two ticks beyond the highest or lowest price observed from sweep through
      entry; reject distances below six ticks or above the smaller of sixty ticks and 1.25 times causal ATR14.
    target_exit_rationale: Require midpoint reward of at least 1R and opposite value-edge reward of at least 2R before entry.
      Every accepted entry contains exactly two contracts. Exit one at the frozen midpoint, move the remaining contract's
      stop one tick beyond entry, and exit that contract at the opposite value edge or after twelve bars.
    profitability_rationale: The proposed edge is that a failed excursion beyond a mature, high-confluence non-trending range
      boundary reveals rejection; participants caught outside value may help price rotate first to the profile midpoint frozen
      when the AOI qualified and, conditionally, to its opposite value edge.
    known_failure_modes: A sweep can be a brief pause before genuine continuation; developing profiles can change after the
      causal snapshot; burst classification can miss institutionally split execution; an undefined regime can conceal a transition
      before the trend classifier confirms it; non-trending structure can transition to trend during either entry window;
      and cost-aware sizing can reduce a valid setup to no executable contract.
    session_logic_rationale: Evaluate the same predeclared range-edge mechanic in two liquid RTH windows, 09:33-11:30 and
      13:30-15:30 New York, without the trend-LVN model or pyramiding. Permit at most three entries, stop new entries after
      500 dollars realised loss, cool down for three bars after exit, and flatten at 15:55.
    causal_availability: Profiles, regime, ATR, delta ratios and signal bars publish only after the relevant three-minute
      close. Orders created from a close activate no earlier than the next ordered trade event. Execution bursts become available
      only when a side, price-range or time-gap break completes them. The AOI and value-profile objectives are frozen at the
      completed balanced or undefined non-trending bar where the AOI first qualifies. A future sweep can reference that immutable
      snapshot for no more than three consecutive undefined-regime bars unless a new score-three observation causally refreshes
      the AOI; later developing-profile movement cannot rewrite an existing snapshot.
    pre_test_decision: approve_for_testing
  timeframe_rationale: Three-minute bars define the developing profiles, rolling thirty-minute regime windows, sweep and failure
    sequence, ATR14, order expiry, cooldown and maximum hold. Entries are restricted to 09:33-11:30 and 13:30-15:30 New York,
    and all positions flatten at 15:55.
