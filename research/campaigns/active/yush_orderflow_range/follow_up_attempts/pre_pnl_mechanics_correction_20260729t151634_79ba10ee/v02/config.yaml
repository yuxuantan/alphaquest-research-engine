    reason: Increase the pre-PnL v02 fixed-risk cap so every accepted entry contains exactly two ES contracts, allowing an
      auditable one-contract TP1 exit and one-contract TP2 runner. Cap size at two, reject fills that cannot support both
      contracts within the risk budget, and align the configured prop contract limit. No performance results informed this
      correction.
