      or newly accumulated top-decile absolute four-tick delta cell. For a short the confirmation label must be strictly above
      the frozen AOI-zone bottom; for a long it must be strictly below the frozen AOI-zone top. Only then is the stop-market
      reclaim entry armed two ticks beyond that boundary. There is no AOI supersession model or intended-stop invalidation
      before fill, and the confirmed entry order has no clock expiry.
    stop: The order is submitted without a predeclared stop. On the exact causal fill event, after that event has updated
      the path, resolve the stop two ticks beyond the adverse extreme observed from the entire sweep bar through the entry
      event, inclusive. Validate the minimum and causal-ATR maximum, size from the resolved risk, and create the position
      only after the stop is valid.
    target: When a per-bar AOI is created, retain its value-area midpoint and opposite edge for any setup swept from that
      AOI. Exit half at the midpoint and the remainder two ticks outside the opposite value-area edge; two ticks below frozen
      VAL for a short and two ticks above frozen VAH for a long. The one-to-one gross midpoint reward gate is evaluated on
      the fill event against the resolved sweep-to-entry stop.
    timeframe_session: Build causally from one RTH profile beginning at 09:30 without a 13:30 reset. Entries remain restricted
      to 09:39-11:30 and 13:39-15:30 New York, with forced flatten at 15:55. Strategy mechanics have no daily trade cap; account
      controls remain separate.
