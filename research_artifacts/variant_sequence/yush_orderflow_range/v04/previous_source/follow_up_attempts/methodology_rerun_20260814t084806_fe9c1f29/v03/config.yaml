research_metadata:
  authoring_contract: alphaquest.campaign-draft/v1
  mechanic_signature: 418113b8e8fa2fe7c841ba0abbda832e213547fc0f36a2fa1bedb68bb6b9d437
  mechanics_review_required: true
  mechanics_review_version: 1
  mechanics_review:
    mechanic_expresses_edge: Freeze an exact developing MotiveWave Standard VAH for a potential short or VAL for a potential
      long only when a causal prior-20-session q99.9 exceptional aggressive-volume cell is direction-matched and lies at the
      edge or up to four ticks outward. Shorts require buy aggression at or above VAH; longs require sell aggression at or
      below VAL. Trade a failed excursion after an ordered inside-to-outside crossing and a completed close one tick back
      inside. Delta, market-level confluence and trend classification do not qualify or veto a setup.
    entry_logic_rationale: An ordered trade at or inside the frozen edge arms one crossing. A later ordered trade reaching
      the ATR-normalized sweep distance records one sweep, which becomes actionable only after that three-minute bar completes.
      Continuous trading outside the edge cannot repeatedly create sweep bars. A burst may qualify an edge only within the
      selected two, three, four or five completed-bar causal freshness window. Once armed, that AOI receives a fixed 30-minute
      safety lifetime from the arming timestamp. A genuinely newer qualifying burst may supersede an unswept AOI, with both
      identities and timestamps audited. Once a sweep episode begins, its frozen edge and POC can never be superseded. A new
      burst can re-arm the same price after the prior AOI retires. The one-tick MotiveWave Standard profile warms for three
      completed bars in each 09:30 and 13:30 auction epoch. A reclaim must close one tick back inside within three completed
      bars, then entry occurs at the next ordered event with one adverse tick.
    stop_loss_rationale: Place the protective stop beyond the most adverse price observed from sweep through reclaim, plus
      one tick. Reject structural risk below two ticks or above the selected causal ATR multiple. ES remains the signal and
      order-flow instrument; executable sizing uses MES economics. Quantity is the floor of 0.4 percent of current net liquidation
      divided by all-in risk per MES. A valid signal is rejected only when one MES, including one adverse stop-fill tick and
      round-turn commission, exceeds that 0.4-percent ceiling.
    target_exit_rationale: Freeze the single exit at profile POC, the first direct fair-value objective of the failed-auction
      hypothesis. POC reward-to-risk is recorded but does not independently veto a setup. The target must remain net profitable
      after modeled round-trip costs. The variable-size MES position exits completely there, subject to stop-first ordering
      and maximum-hold rules.
    profitability_rationale: The candidate edge is local auction rejection after exceptional outward aggression at value.
      Event-order crossing memory prevents false repeated sweeps; direction, outward location, predeclared burst freshness,
      a net-profitable POC and the structural-stop ceiling are the only opportunity filters retained.
    known_failure_modes: A failed excursion may still precede continuation; a three-bar warmup is noisier than a five-bar
      warmup; one-tick profile rows can make value edges more sensitive to local volume; a narrow freshness setting may reduce
      signal frequency while a broad one may admit decayed information; supersession can replace a valid but slow-developing
      unswept AOI; removing the trend veto permits reversals during strong directional sessions; and the POC-only exit can
      leave additional reversion profit unrealized when price reaches the opposite value edge.
    session_logic_rationale: Evaluate the same frozen mechanic in two liquid RTH windows, 09:39-11:30 and 13:39-15:30 New
      York. The afternoon volume profile resets causally at 13:30. Strategy mechanics have no daily trade cap; account and
      prop-risk controls remain separate. Executable evidence begins on the MES launch date, 2019-05-06. Flatten at 15:55.
    causal_availability: Profiles and ATR use completed bars only. Burst thresholds use prior completed sessions. Crossing
      memory consumes only ordered events observed after the AOI froze. A sweep episode publishes at the close of its event's
      three-minute bar; a reclaim publishes at a later completed close; entry activates on the next ordered event. Later profile
      movement cannot rewrite the frozen edge, POC or AOI identity.
    pre_test_decision: approve_for_testing
  timeframe_rationale: Three-minute bars publish the developing profile, ATR, sweep episode and reclaim decision. Ordered
    canonical trade events prove the inside-to-outside crossing without using an unknowable OHLC path. Entries are restricted
    to 09:39-11:30 and 13:39-15:30 New York, and all positions flatten at 15:55.
  validation_gate:
    required: true
    lane: event_replay
    parameter_mode: declared_defaults
    manual_review_random_sample_size: 5
    manual_review_seed: 7
    data_subset:
      start_date: '2026-05-14'
      end_date: '2026-05-29'
    evidence_dir: /Users/yx/Desktop/alphaquest-research-engine/research/evidence/runs/yush_orderflow_range/v03/ES/mechanics_validation_methodology_rerun_20260814t084806_fe9c1f29/validation_runs/core
    approval_path: /Users/yx/Desktop/alphaquest-research-engine/research_artifacts/validation_approvals/yush_orderflow_range/methodology_rerun_20260814t084806_fe9c1f29/v03/approval.json
    minimum_trade_samples: 5
    session_count: 10
    selection_mode: latest_eligible_sessions
  parent_variant_id: v03
  follow_up:
    schema: alphaquest.follow-up-attempt/v1
    attempt_id: methodology_rerun_20260814t084806_fe9c1f29
    attempt_kind: methodology_rerun
    parent_attempt_id: methodology_rerun_20260813t140112_9c4dd0a8
