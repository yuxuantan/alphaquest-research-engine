research_metadata:
  authoring_contract: alphaquest.campaign-draft/v1
  mechanic_signature: 418113b8e8fa2fe7c841ba0abbda832e213547fc0f36a2fa1bedb68bb6b9d437
  mechanics_review_required: true
  mechanics_review_version: 1
  mechanics_review:
    mechanic_expresses_edge: Freeze an exact developing MotiveWave Standard VAH for a potential short or VAL for a potential
      long only when its included one-point row contains a causal large-execution burst or top-decile absolute delta. Trade
      a failed excursion after an ordered inside-to-outside crossing and completed-bar reclaim, unless the completed regime
      state shows a direction-aligned breakout.
    entry_logic_rationale: An ordered trade at or inside the frozen edge arms one crossing. A later ordered trade reaching
      the ATR-normalized sweep distance records one sweep, which becomes actionable only after that three-minute bar completes.
      Continuous trading outside the edge cannot repeatedly create sweep bars. The frozen footprint may be absent for zero,
      one or two completed bars, with one as the reviewed default, but the AOI expires immediately if the developing edge
      drifts more than eight ticks or after thirty minutes. The profile warms for three completed bars in each 09:30 and 13:30
      auction epoch. A reclaim must close the ATR-normalized depth back inside within three completed bars, then entry occurs
      at the next ordered event with one adverse tick.
    stop_loss_rationale: Place the protective stop beyond the most adverse price observed from sweep through reclaim, plus
      the frozen ATR-normalized buffer. Reject structural risk below two ticks or above the selected causal ATR multiple.
      ES remains the signal and order-flow instrument; executable sizing uses MES economics. Quantity is the floor of 0.4
      percent of current net liquidation divided by all-in risk per MES. A valid signal is rejected only when one MES, including
      one adverse stop-fill tick and round-turn commission, exceeds that 0.4-percent ceiling.
    target_exit_rationale: Freeze the single exit at profile POC, the first direct fair-value objective of the failed-auction
      hypothesis. The POC must remain positive after round-trip commissions and meet the selected 0.75R, 1.0R or 1.25R threshold.
      The variable-size MES position exits completely there, subject to stop-first ordering and maximum-hold rules.
    profitability_rationale: The candidate edge is local auction rejection after exceptional activity at value. Event-order
      crossing memory prevents false repeated sweeps, while brief footprint grace and a POC reward gate reduce regime-specific
      opportunity loss without changing the economic hypothesis.
    known_failure_modes: A failed excursion may still precede continuation; a three-bar warmup is noisier than a five-bar
      warmup; footprint grace may preserve decaying information; an eight-tick profile drift allowance may leave the frozen
      edge less representative; and the POC-only exit can leave additional reversion profit unrealized when price reaches
      the opposite value edge.
    session_logic_rationale: Evaluate the same frozen mechanic in two liquid RTH windows, 09:39-11:30 and 13:39-15:30 New
      York. The afternoon volume and delta profile resets causally at 13:30. Strategy mechanics have no daily trade cap; account
      and prop-risk controls remain separate. Executable evidence begins on the MES launch date, 2019-05-06. Flatten at 15:55.
    causal_availability: Profiles, ATR, delta and trend states use completed bars only. Crossing memory consumes only ordered
      events observed after the AOI froze. A sweep episode publishes at the close of its event's three-minute bar; a reclaim
      publishes at a later completed close; entry activates on the next ordered event. Footprint thresholds use prior completed
      sessions, and later profile movement cannot rewrite the frozen edge, POC, opposite edge or AOI identity.
    pre_test_decision: approve_for_testing
  timeframe_rationale: Three-minute bars publish profiles, ATR, trend state, sweep episodes and reclaim decisions. Ordered
    canonical trade events prove the inside-to-outside crossing without using an unknowable OHLC path. Entries are restricted
    to 09:39-11:30 and 13:39-15:30 New York, and all positions flatten at 15:55.
