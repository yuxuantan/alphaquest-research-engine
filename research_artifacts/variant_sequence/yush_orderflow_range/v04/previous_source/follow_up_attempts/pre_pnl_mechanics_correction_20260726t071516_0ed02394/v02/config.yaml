  mechanics_review_required: true
  mechanics_review_version: 1
  mechanics_review:
    mechanic_expresses_edge: Express the same absorption-to-fair-value hypothesis through a failed auction rather than a repeated
      AOI tap. Freeze the causal developing value boundary, nearby known reference, and POC before the excursion; require
      directed aggression outside value to fail and price to reclaim the boundary before considering an entry.
    entry_logic_rationale: A trade is eligible only after price crosses outside a frozen VAL or VAH, travels the predeclared
      excursion distance, shows outward aggressive flow, and then trades one tick back inside value within the allowed causal
      window. The signal is created on that reclaim and the generic engine may fill only on the next ordered trade event.
    stop_loss_rationale: The protective stop is fixed beyond the most adverse price observed during the failed outside excursion
      plus a reviewed tick buffer. This ties risk to the structure that falsifies the failed-auction premise, rejects entries
      above the maximum stop distance, and avoids the v01 AOI-envelope stop geometry.
    target_exit_rationale: The primary target is the developing POC frozen when the episode begins because it is the causal
      fair-value objective of the re-entry. A ten-minute maximum holding period exits on the next ordered event, and the generic
      engine retains the configured 11:00 New York forced flatten as the final safety boundary.
    profitability_rationale: Repeated rejection at a developing value boundary suggests passive liquidity is absorbing aggressive
      flow; a fresh delta or large-trade event after the tap supplies causal confirmation for reversion. Express the same
      absorption-to-fair-value hypothesis through a failed auction rather than a repeated AOI tap. Freeze the causal developing
      value boundary, nearby known reference, and POC before the excursion; require directed aggression outside value to fail
      and price to reclaim the boundary before considering an entry.
    known_failure_modes: A failed auction may simply pause before continuation, so a reclaim can reverse again and stop beyond
      the excursion extreme; sparse or misclassified aggressor-side data can also suppress valid episodes or admit weak ones.
      The frozen POC can be too close to cover execution costs or too distant to reach before the time exit; the reward-risk
      gate rejects the former, but the latter can still create many time exits and negative expectancy. Developing value boundaries
      and nearby references can change rapidly in the opening minutes; freezing them prevents lookahead but may deliberately
      trade from a level that the live profile no longer emphasizes.
    pre_test_decision: approve_for_testing
  timeframe_rationale: Raw Sierra trade messages remain the execution clock from 09:30 to 11:00 New York. Developing value
    and directional delta use only events already observed, the 100 millisecond decision boundary is retained for shared feature-tape
    calculation, and exact intervening ticks remain available for entry, stop, target, and time-exit ordering.
