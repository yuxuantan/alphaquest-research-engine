        decision_interval_ms: 100
        reference_distance_ticks: 4
        excursion_ticks: 4
        reclaim_window_seconds: 15
        stop_buffer_ticks: 2
        time_exit_seconds: 600
        minimum_reward_risk: 1.0
    parameter_grid: {}
  stop:
    module: event_excursion_structural_stop
    params: {}
    parameter_grid: {}
  target:
    module: event_frozen_poc_time_exit
    params: {}
    parameter_grid: {}
  event_parameter_grid:
    excursion_ticks:
    - 2
    - 4
    - 6
    reclaim_window_seconds:
    - 5
    - 15
    - 30
    stop_buffer_ticks:
    - 1
    - 2
    - 3
  rationales:
    mechanic: Express the same absorption-to-fair-value hypothesis through a failed auction rather than a repeated AOI tap.
      Freeze the causal developing value boundary, nearby known reference, and POC before the excursion; require directed
      aggression outside value to fail and price to reclaim the boundary before considering an entry.
    entry: A trade is eligible only after price crosses outside a frozen VAL or VAH, travels the predeclared excursion distance,
      shows outward aggressive flow, and then trades one tick back inside value within the allowed causal window. The signal
      is created on that reclaim and the generic engine may fill only on the next ordered trade event.
    stop: The protective stop is fixed beyond the most adverse price observed during the failed outside excursion plus a reviewed
      tick buffer. This ties risk to the structure that falsifies the failed-auction premise, rejects entries above the maximum
      stop distance, and avoids the v01 AOI-envelope stop geometry.
    target: The primary target is the developing POC frozen when the episode begins because it is the causal fair-value objective
      of the re-entry. A ten-minute maximum holding period exits on the next ordered event, and the generic engine retains
      the configured 11:00 New York forced flatten as the final safety boundary.
    timeframe_session: Raw Sierra trade messages remain the execution clock from 09:30 to 11:00 New York. Developing value
      and directional delta use only events already observed, the 100 millisecond decision boundary is retained for shared
      feature-tape calculation, and exact intervening ticks remain available for entry, stop, target, and time-exit ordering.
