research_metadata:
  authoring_contract: alphaquest.campaign-draft/v1
  mechanic_signature: 6d050f7c4993bba8253313b0cea3e8d41fb54c852a6209609af4bc0a8ecdc8f8
  mechanics_review_required: true
  mechanics_review_version: 1
  mechanics_review:
    mechanic_expresses_edge: Build on v01's exact developing-value AOI, prior reversal, directed retap, and fresh post-tap
      order-flow confirmation. Scale AOI width and order-flow magnitude to the causal volatility and activity observed for
      that session.
    entry_logic_rationale: The AOI width limit is fixed at 1.5 times causal three-minute ATR14 and capped at five points.
      Entry remains a one-tick stop beyond the exact AOI after a prior reversal, fresh directed tap, and post-tap adaptive
      delta or large-trade trigger.
    stop_loss_rationale: The stop is fixed one tick beyond the opposite AOI edge. The actual zero-slippage fill-to-stop distance
      must be no greater than five ES points, limiting one-contract price risk to 250 dollars before commissions.
    target_exit_rationale: The developing value midpoint is frozen as the initial take-profit when the order is live. There
      is no breakeven transition and no opposite-value-edge continuation; the position also obeys the 11:00 forced flatten.
    profitability_rationale: Repeated rejection at developing value suggests passive absorption. Activity-normalized post-tap
      aggression avoids treating a fixed contract count as equally exceptional across different session regimes.
    known_failure_modes: ATR can expand the AOI to its five-point cap during volatile sessions; early-session delta confirmation
      is unavailable until one RTH three-minute bar closes; zero slippage is optimistic and must be challenged in robustness
      testing; a fixed midpoint target can be too close to a gapped stop-entry fill and is rejected when not favorable.
    pre_test_decision: approve_for_testing
  timeframe_rationale: Trade events are replayed from 09:30 to 11:00 New York. AOI width uses three-minute Wilder ATR14 seeded
    only by completed ETH bars; delta averages update only after completed RTH three-minute bars; large-trade averages use
    elapsed 100 millisecond intervals since 09:30.
  validation_gate:
    required: true
    lane: event_replay
    parameter_mode: declared_defaults
    manual_review_random_sample_size: 5
    manual_review_seed: 0
    data_subset:
      start_date: '2026-05-12'
      end_date: '2026-05-26'
    evidence_dir: /Users/yx/Desktop/alphaquest-research-engine/research/evidence/runs/yush_orderflow_range/v02/ES/mechanics_validation_methodology_rerun_20260727t060710_0ecb6340/validation_runs/core
    approval_path: /Users/yx/Desktop/alphaquest-research-engine/research_artifacts/validation_approvals/yush_orderflow_range/methodology_rerun_20260727t060710_0ecb6340/v02/approval.json
  parent_variant_id: v02
  follow_up:
